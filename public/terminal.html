<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Terminal – WebControl HQ</title>
  <link rel="stylesheet" href="css/main.css">
  <style>
    /* ════════════════════════════════════════════════════════════
       Terminal – eigene Handschrift: dichter, sachlicher, wärmer im
       Akzent als der übrige Manager. Zahlen durchgehend dicktengleich,
       damit Spalten untereinander lesbar bleiben.
       ════════════════════════════════════════════════════════════ */
    :root {
      --t-bg:      #07090d;
      --t-panel:   #0d1117;
      --t-panel2:  #131a23;
      --t-linie:   #1c2733;
      --t-linie2:  #2a3a4d;
      --t-text:    #e6edf5;
      --t-text2:   #8b9bb0;
      --t-text3:   #526074;
      --t-akzent:  #f0b429;
      --t-akzent2: #ffd166;
      --t-auf:     #3fd68c;
      --t-ab:      #ff6b6b;
      --t-info:    #58a6ff;
    }
    #main { overflow: hidden; background: var(--t-bg); }
    .tm { display:flex; flex-direction:column; height:100%; background:var(--t-bg); color:var(--t-text);
          font-family:'Space Mono',ui-monospace,monospace; }

    /* ── Kopfleiste ─────────────────────────────────────────── */
    .tm-kopf { display:flex; align-items:center; gap:10px; padding:0 12px; height:42px;
               background:linear-gradient(180deg,#0e141c,#0a0f15); border-bottom:1px solid var(--t-linie);
               flex-shrink:0; }
    .tm-logo { font-size:11px; font-weight:700; letter-spacing:.22em; color:var(--t-akzent);
               white-space:nowrap; padding-right:10px; border-right:1px solid var(--t-linie); }
    .tm-cmd { position:relative; width:min(340px,34vw); }
    .tm-cmd input { width:100%; background:#050709; border:1px solid var(--t-linie2); color:var(--t-akzent2);
                    border-radius:3px; padding:5px 10px; font-family:inherit; font-size:11.5px;
                    letter-spacing:.08em; text-transform:uppercase; }
    .tm-cmd input::placeholder { color:var(--t-text3); text-transform:none; letter-spacing:.02em; }
    .tm-cmd input:focus { outline:none; border-color:var(--t-akzent); box-shadow:0 0 0 2px rgba(240,180,41,.14); }
    .tm-vor { display:none; position:absolute; top:100%; left:0; right:0; z-index:80; margin-top:3px;
              background:var(--t-panel2); border:1px solid var(--t-linie2); border-radius:3px;
              max-height:320px; overflow-y:auto; box-shadow:0 18px 40px -16px #000; }
    .tm-vor-z { padding:6px 10px; cursor:pointer; border-bottom:1px solid var(--t-linie); }
    .tm-vor-z:hover, .tm-vor-z.an { background:rgba(240,180,41,.14); }
    .tm-vor-z b { font-size:11.5px; color:var(--t-akzent2); }
    .tm-vor-z i { display:block; font-style:normal; font-size:10px; color:var(--t-text2); }

    .tm-schirme { display:flex; gap:1px; margin-left:4px; }
    .tm-schirm { padding:5px 10px; font-size:10px; font-family:inherit; letter-spacing:.1em;
                 background:none; border:1px solid transparent; border-radius:3px; color:var(--t-text3);
                 cursor:pointer; white-space:nowrap; }
    .tm-schirm:hover { color:var(--t-text2); background:#11181f; }
    .tm-schirm.an { color:#0a0d12; background:var(--t-akzent); font-weight:700; }
    .tm-schirm span { opacity:.55; margin-right:4px; }
    .tm-schirm.an span { opacity:.7; }

    .tm-status { margin-left:auto; display:flex; align-items:center; gap:14px; font-size:10px; color:var(--t-text3); }
    .tm-led { width:6px; height:6px; border-radius:50%; background:var(--t-auf); display:inline-block; margin-right:5px; }

    /* ── Fläche ─────────────────────────────────────────────── */
    .tm-flaeche { flex:1; overflow:hidden; display:flex; min-height:0; }
    .tm-haupt { flex:1; overflow-y:auto; min-width:0; }
    .tm-seite { width:250px; border-left:1px solid var(--t-linie); overflow-y:auto; background:var(--t-panel);
                flex-shrink:0; }
    @media (max-width:1180px){ .tm-seite{ display:none; } }

    /* ── Bausteine ──────────────────────────────────────────── */
    .tm-block { border-bottom:1px solid var(--t-linie); }
    .tm-titel { display:flex; align-items:center; gap:8px; padding:6px 12px; font-size:9.5px;
                letter-spacing:.16em; text-transform:uppercase; color:var(--t-text3);
                background:var(--t-panel); border-bottom:1px solid var(--t-linie); position:sticky; top:0; z-index:3; }
    .tm-titel .zahl { margin-left:auto; color:var(--t-text2); }

    .tm-kacheln { display:grid; grid-template-columns:repeat(auto-fit,minmax(118px,1fr)); gap:1px; background:var(--t-linie); }
    .tm-kachel { background:var(--t-panel); padding:8px 11px; }
    .tm-k-name { font-size:8.5px; letter-spacing:.13em; text-transform:uppercase; color:var(--t-text3); }
    .tm-k-wert { font-size:15px; font-weight:700; margin-top:3px; letter-spacing:-.01em; }
    .tm-k-neben { font-size:9.5px; color:var(--t-text3); margin-top:2px; }

    table.tm-t { width:100%; border-collapse:collapse; font-size:11px; }
    table.tm-t th { position:sticky; top:0; background:var(--t-panel); text-align:right; font-weight:400;
                    font-size:8.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--t-text3);
                    padding:6px 8px; border-bottom:1px solid var(--t-linie); cursor:pointer; white-space:nowrap; z-index:2; }
    table.tm-t th:first-child, table.tm-t td:first-child { text-align:left; }
    table.tm-t th.an { color:var(--t-akzent); }
    table.tm-t td { padding:5px 8px; text-align:right; border-bottom:1px solid rgba(255,255,255,.035); white-space:nowrap; }
    table.tm-t tr:hover td { background:rgba(240,180,41,.06); cursor:pointer; }
    table.tm-t tr.aktiv td { background:rgba(240,180,41,.12); }
    .sym { font-weight:700; color:var(--t-akzent2); }
    .nm { color:var(--t-text2); font-size:10px; }

    .auf { color:var(--t-auf); } .ab { color:var(--t-ab); } .neutr { color:var(--t-text2); }
    .dim { color:var(--t-text3); }

    .balken { height:4px; border-radius:2px; background:var(--t-linie); overflow:hidden; }
    .balken > div { height:100%; }

    .tm-zeile { display:flex; justify-content:space-between; gap:10px; padding:4px 12px; font-size:11px;
                border-bottom:1px solid rgba(255,255,255,.035); }
    .tm-zeile > span:first-child { color:var(--t-text3); }

    .tm-hint { margin:10px 12px; padding:8px 11px; border-radius:3px; font-size:10.5px; line-height:1.55;
               background:rgba(88,166,255,.07); border-left:2px solid var(--t-info); color:var(--t-text2);
               font-family:'Syne',sans-serif; }
    .tm-warn { background:rgba(240,180,41,.07); border-left-color:var(--t-akzent); }
    .tm-leer { padding:30px 14px; text-align:center; color:var(--t-text3); font-size:11px; }

    .knopf { padding:3px 9px; font-size:9.5px; font-family:inherit; letter-spacing:.08em; background:none;
             border:1px solid var(--t-linie2); border-radius:3px; color:var(--t-text2); cursor:pointer; }
    .knopf:hover { border-color:var(--t-akzent); color:var(--t-akzent2); }
    .knopf.an { background:var(--t-akzent); border-color:var(--t-akzent); color:#0a0d12; font-weight:700; }

    .marke2 { font-size:8.5px; padding:1px 5px; border-radius:2px; letter-spacing:.06em; }
    .m-auf { background:rgba(63,214,140,.16); color:var(--t-auf); }
    .m-ab  { background:rgba(255,107,107,.16); color:var(--t-ab); }
    .m-neu { background:rgba(255,255,255,.07); color:var(--t-text2); }
    .m-akz { background:rgba(240,180,41,.16); color:var(--t-akzent2); }

    .md { font-size:12px; line-height:1.65; color:var(--t-text2); font-family:'Syne',sans-serif; }
    .md h1,.md h2,.md h3 { color:var(--t-text); font-size:13px; margin:12px 0 5px; }
    .md code { background:#050709; padding:1px 4px; border-radius:2px; color:var(--t-akzent2); font-size:11px; }
    .md pre { background:#050709; border:1px solid var(--t-linie); border-radius:3px; padding:9px; overflow-x:auto; }
    .md table { border-collapse:collapse; font-size:11px; margin:8px 0; }
    .md th,.md td { border:1px solid var(--t-linie); padding:3px 7px; }
  </style>
</head>
<body>

<div id="layout">
  <div id="main">
    <div class="tm">
      <div class="tm-kopf">
        <span class="tm-logo">TERMINAL</span>
        <div class="tm-cmd">
          <input id="cmd" placeholder="Symbol oder Kürzel — DEP, MON, VGL, RIS, KAL, NEW, KI"
                 autocomplete="off" onkeydown="cmdTaste(event)" oninput="cmdTippen()">
          <div class="tm-vor" id="cmd-vor"></div>
        </div>
        <div class="tm-schirme" id="schirme"></div>
        <div class="tm-status">
          <span id="st-fx"></span>
          <span><span class="tm-led" id="st-led"></span><span id="st-zeit">–</span></span>
        </div>
      </div>
      <div class="tm-flaeche">
        <div class="tm-haupt" id="haupt"></div>
        <div class="tm-seite" id="seite"></div>
      </div>
    </div>
  </div>
</div>

<script src="js/utils.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/layout.js"></script>
<script>
// ════════════════════════════════════════════════════════════════
// Terminal
// ════════════════════════════════════════════════════════════════
// Schirme werden über Kürzel angesprungen, wie in einem Handelssystem.
// Alles Gerechnete stammt aus dem eigenen Kursspeicher; externe Abrufe
// nur dort, wo es ohne sie nicht geht, und dann sichtbar begrenzt.
//
// Grenze wie überall in diesem Bereich: Fakten ja, Empfehlungen nein.
// Fremde Einschätzungen erscheinen ausdrücklich als fremd.
// ════════════════════════════════════════════════════════════════

const SCHIRME = [
  ['DEP', 'Depot',      'schirmDepot'],
  ['MON', 'Monitor',    'schirmMonitor'],
  ['WRT', 'Einzelwert', 'schirmWert'],
  ['VGL', 'Vergleich',  'schirmVergleich'],
  ['RIS', 'Risiko',     'schirmRisiko'],
  ['KAL', 'Kalender',   'schirmKalender'],
  ['NEW', 'Meldungen',  'schirmMeldungen'],
  ['KI',  'Agentur',    'schirmAgentur'],
];

let SCHIRM   = 'DEP';
let MONITOR  = null;   // Zeilen je Wert, aus eigenem Speicher
let UEBER    = null;   // Depotübersicht
let AKTIV    = null;   // gewähltes Symbol
let DETAIL   = null;   // Antwort von /terminal
let KORR     = null;
let KALENDER = null;
let STROM    = null;
let AGENTUR  = null;
let SORT     = { feld: 'wert_eur', ab: true };
let VGL_WAHL = [];
let ZEITRAUM = 0;
let LINIEN   = { sma20: true, sma50: true, sma200: false, bollinger: false };
let PANEL    = 'nachrichten';

// ── Formatierung ────────────────────────────────────────────────
const z2 = (n, s = 2) => n === null || n === undefined || !Number.isFinite(Number(n))
  ? '–' : Number(n).toLocaleString('de-DE', { minimumFractionDigits: s, maximumFractionDigits: s });
const pz = n => n === null || n === undefined || !Number.isFinite(Number(n))
  ? '–' : `${n > 0 ? '+' : ''}${Number(n).toFixed(2)}`;
const kl = n => n === null || n === undefined || !Number.isFinite(Number(n))
  ? 'neutr' : n > 0 ? 'auf' : n < 0 ? 'ab' : 'neutr';
const gr = (n, w) => n === null || n === undefined ? '–'
  : `${Number(n).toLocaleString('de-DE', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}${w ? ' ' + w : ''}`;

// ════════════════════════════════════════════════════════════════
// Diagramm-Bausteine
// ════════════════════════════════════════════════════════════════
// Beschriftungen stehen bewusst NICHT im SVG: die Zeichenfläche wird mit
// preserveAspectRatio="none" horizontal gestreckt, damit die Kurve die
// volle Breite nutzt – Schrift darin würde im selben Maß gestaucht. Achsen
// sind deshalb HTML, exakt über der Fläche positioniert.
const CHARTS = {};   // id -> { tage, reihen, mass }

function chartBauen({ id, reihen, hoehe = 320, yLabel = '', normiert = false, flaechen = true }) {
  const gueltig = reihen.filter(r => r.punkte && r.punkte.length > 1);
  if (!gueltig.length) {
    return `<div class="tm-leer" style="border:1px dashed var(--t-linie2);border-radius:3px;margin:12px">
      Kein Verlauf vorhanden.</div>`;
  }

  // Zeitachse ist die ERSTE Reihe. Überlagerungen wie gleitende
  // Durchschnitte beginnen später und dürfen den Kursverlauf nicht
  // beschneiden – sie bekommen dort schlicht keine Werte.
  // Bei mehreren gleichrangigen Reihen (Vergleich) wird auf die
  // gemeinsamen Tage beschnitten, sonst verglichen man Zeiträume.
  let tage;
  if (normiert && gueltig.length > 1) {
    const mengen = gueltig.map(r => new Set(r.punkte.map(p => p.datum)));
    tage = [...mengen[0]].filter(d => mengen.every(m => m.has(d))).sort();
  } else {
    tage = gueltig[0].punkte.map(p => p.datum).sort();
  }
  if (tage.length < 2) {
    return `<div class="tm-leer" style="border:1px dashed var(--t-linie2);border-radius:3px;margin:12px">
      Nur ${tage.length} gemeinsamer Handelstag — zu wenig für eine Linie.</div>`;
  }

  const serien = gueltig.map(r => {
    const m = new Map(r.punkte.map(p => [p.datum, p]));
    const werte = tage.map(d => m.get(d) || null);
    const ersterWert = werte.find(Boolean);
    const basis = ersterWert?.kurs || 1;
    return { ...r, werte, zahlen: werte.map(p => p ? (normiert ? (p.kurs / basis) * 100 : p.kurs) : null) };
  });

  const alleZahlen = serien.flatMap(s => s.zahlen).filter(Number.isFinite);
  let min = Math.min(...alleZahlen), max = Math.max(...alleZahlen);
  const luft = (max - min) * 0.06 || Math.abs(max) * 0.02 || 1;
  min -= luft; max += luft;
  const sp = (max - min) || 1;

  // Nur die Zeichenfläche im SVG. Rechts bleibt Platz für die Achse in HTML.
  const B = 1000, H = 100;                    // Einheitsraster, wird gestreckt
  const RECHTS = 58;                          // Pixel für die Werteachse
  const px = i => (i / (tage.length - 1)) * B;
  const py = v => (1 - (v - min) / sp) * H;

  const gitterZahl = 5;
  const gitter = Array.from({ length: gitterZahl + 1 }, (_, i) => {
    const y = (i / gitterZahl) * H;
    return `<line x1="0" y1="${y}" x2="${B}" y2="${y}" stroke="rgba(255,255,255,.05)"
             stroke-width="1" vector-effect="non-scaling-stroke"/>`;
  }).join('');

  // Lücken (Reihe beginnt später) werden nicht überbrückt, sondern
  // getrennt gezeichnet – eine durchgezogene Linie über fehlende Tage
  // würde Werte behaupten, die es nicht gibt.
  const pfade = serien.map(s => {
    const stuecke = [];
    let lauf = [];
    s.zahlen.forEach((v, i) => {
      if (Number.isFinite(v)) lauf.push(`${px(i).toFixed(2)},${py(v).toFixed(2)}`);
      else if (lauf.length) { stuecke.push(lauf); lauf = []; }
    });
    if (lauf.length) stuecke.push(lauf);

    const flaeche = (flaechen && serien.length === 1 && stuecke.length === 1)
      ? `<polygon points="0,${H} ${stuecke[0].join(' ')} ${B},${H}" fill="url(#${id}-f)"/>` : '';
    return flaeche + stuecke.filter(t => t.length > 1).map(t =>
      `<polyline points="${t.join(' ')}" fill="none" stroke="${s.farbe}"
        stroke-width="${s.dick || 1.6}" ${s.strich ? `stroke-dasharray="${s.strich}"` : ''}
        stroke-linejoin="round" vector-effect="non-scaling-stroke" opacity="${s.deckung || 1}"/>`).join('');
  }).join('');

  const erste = serien[0];
  const steigt = erste.zahlen[erste.zahlen.length - 1] >= erste.zahlen[0];
  const grund = erste.farbe || (steigt ? '#3fd68c' : '#ff6b6b');

  // Werteachse rechts, als HTML – gleichmäßig verteilt wie die Gitterlinien.
  const yAchse = Array.from({ length: gitterZahl + 1 }, (_, i) => {
    const v = max - (sp * i) / gitterZahl;
    return `<div style="position:absolute;right:0;top:${(i / gitterZahl * 100).toFixed(2)}%;
      transform:translateY(-50%);font-size:9.5px;color:var(--t-text3);line-height:1;
      width:${RECHTS - 6}px;text-align:right">${normiert ? v.toFixed(0) : z2(v)}</div>`;
  }).join('');

  // Datumsachse: fünf Stützstellen statt nur Anfang und Ende.
  const stuetzen = Math.min(5, tage.length);
  const xAchse = Array.from({ length: stuetzen }, (_, i) => {
    const k = Math.round((i / (stuetzen - 1)) * (tage.length - 1));
    const links = (k / (tage.length - 1)) * 100;
    const ausricht = i === 0 ? 'left:0;text-align:left'
      : i === stuetzen - 1 ? 'right:0;text-align:right'
      : `left:${links.toFixed(2)}%;transform:translateX(-50%)`;
    return `<div style="position:absolute;${ausricht};font-size:9.5px;color:var(--t-text3);white-space:nowrap">
      ${esc(tage[k])}</div>`;
  }).join('');

  CHARTS[id] = { tage, serien: serien.map(s => ({ name: s.name, farbe: s.farbe, werte: s.werte, zahlen: s.zahlen })), normiert };

  return `
    <div class="tm-block" style="padding:10px 12px 4px">
      <div style="position:relative;height:${hoehe}px;padding-right:${RECHTS}px"
           onmousemove="chartFahren(event,'${id}')" onmouseleave="chartVerlassen('${id}')">
        <svg viewBox="0 0 ${B} ${H}" preserveAspectRatio="none"
             style="width:100%;height:100%;display:block;cursor:crosshair" id="${id}-svg">
          <defs><linearGradient id="${id}-f" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="${grund}" stop-opacity=".22"/>
            <stop offset="100%" stop-color="${grund}" stop-opacity="0"/></linearGradient></defs>
          ${gitter}${pfade}
        </svg>
        <div id="${id}-kreuz" style="position:absolute;top:0;bottom:0;width:1px;background:var(--t-text2);
             display:none;pointer-events:none"></div>
        <div id="${id}-punkte" style="position:absolute;inset:0;pointer-events:none"></div>
        ${yAchse}
        <div id="${id}-tip" style="position:absolute;display:none;pointer-events:none;z-index:9;
             background:#050709;border:1px solid var(--t-linie2);border-radius:3px;padding:5px 8px;
             font-size:10.5px;line-height:1.5;white-space:nowrap;box-shadow:0 8px 20px -8px #000"></div>
      </div>
      <div style="position:relative;height:15px;margin-top:3px;padding-right:${RECHTS}px">${xAchse}</div>
      ${yLabel ? `<div style="font-size:9px;color:var(--t-text3);letter-spacing:.1em;text-transform:uppercase;
        margin-top:2px">${esc(yLabel)}</div>` : ''}
    </div>`;
}

// Fadenkreuz mit Ablesung. Zeigt für jede Reihe den Wert an genau diesem
// Tag – bei mehreren Reihen untereinander, damit sie vergleichbar bleiben.
function chartFahren(ev, id) {
  const c = CHARTS[id]; if (!c) return;
  const flaeche = ev.currentTarget;
  const b = flaeche.getBoundingClientRect();
  const svg = document.getElementById(id + '-svg');
  const sb = svg.getBoundingClientRect();
  if (!sb.width) return;   // Fläche noch nicht ausgemessen – nichts anzeigen
  const anteil = Math.max(0, Math.min(1, (ev.clientX - sb.left) / sb.width));
  const i = Math.max(0, Math.min(c.tage.length - 1, Math.round(anteil * (c.tage.length - 1))));
  const x = (i / (c.tage.length - 1)) * sb.width;

  const kreuz = document.getElementById(id + '-kreuz');
  if (kreuz) { kreuz.style.left = x + 'px'; kreuz.style.display = 'block'; }

  // Punkte auf den Linien markieren
  const pkt = document.getElementById(id + '-punkte');
  if (pkt) {
    pkt.innerHTML = c.serien.map(s => {
      const v = s.zahlen[i]; if (!Number.isFinite(v)) return '';
      const alle = c.serien.flatMap(x2 => x2.zahlen).filter(Number.isFinite);
      let mn = Math.min(...alle), mx = Math.max(...alle);
      const luft = (mx - mn) * 0.06 || 1; mn -= luft; mx += luft;
      const y = (1 - (v - mn) / ((mx - mn) || 1)) * sb.height;
      return `<div style="position:absolute;left:${x}px;top:${y}px;width:7px;height:7px;margin:-3.5px 0 0 -3.5px;
        border-radius:50%;background:${s.farbe};box-shadow:0 0 0 2px #07090d"></div>`;
    }).join('');
  }

  const tip = document.getElementById(id + '-tip');
  if (tip) {
    const p0 = c.serien[0].werte[i];
    tip.innerHTML = `<div style="color:var(--t-akzent2);font-weight:700;margin-bottom:2px">${esc(c.tage[i])}</div>`
      + c.serien.map(s => {
          const p = s.werte[i], v = s.zahlen[i];
          if (!Number.isFinite(v)) return '';   // Reihe beginnt später
          const basis = s.zahlen.find(Number.isFinite);
          const seitStart = basis ? ((v - basis) / basis) * 100 : 0;
          return `<div><span style="display:inline-block;width:8px;height:2px;background:${s.farbe};
            vertical-align:middle;margin-right:5px"></span>${esc(s.name || '')}
            <b style="color:var(--t-text)">${c.normiert ? v.toFixed(1) : z2(v)}</b>
            <span class="${kl(seitStart)}">${pz(seitStart)} %</span>
            ${(!c.normiert && p?.hoch) ? `<span class="dim"> H ${z2(p.hoch)} T ${z2(p.tief)}</span>` : ''}</div>`;
        }).join('');
    tip.style.display = 'block';
    const tb = tip.getBoundingClientRect();
    const links = x + 12 + tb.width > b.width ? x - tb.width - 12 : x + 12;
    tip.style.left = Math.max(0, links) + 'px';
    tip.style.top = '6px';
  }
}

function chartVerlassen(id) {
  for (const s of ['-kreuz', '-tip']) {
    const e = document.getElementById(id + s); if (e) e.style.display = 'none';
  }
  const p = document.getElementById(id + '-punkte'); if (p) p.innerHTML = '';
}

// ── Laden ───────────────────────────────────────────────────────
async function ladeGrunddaten() {
  const [m, u] = await Promise.all([
    api('/api/agentur/boerse/monitor'),
    api('/api/agentur/boerse/uebersicht?tage=400'),
  ]);
  MONITOR = m; UEBER = u;
  document.getElementById('st-fx').textContent = m?.fx_stand ? `EZB ${m.fx_stand}` : '';
  document.getElementById('st-zeit').textContent = new Date().toLocaleTimeString('de-DE');
  if (!AKTIV) AKTIV = m?.zeilen?.[0]?.symbol || null;
}

async function zeichne() {
  document.getElementById('schirme').innerHTML = SCHIRME.map(([k, n]) =>
    `<button class="tm-schirm ${SCHIRM === k ? 'an' : ''}" onclick="geheZu('${k}')"><span>${k}</span>${n}</button>`).join('');
  const fn = SCHIRME.find(s => s[0] === SCHIRM)?.[2];
  if (fn && window[fn]) await window[fn]();
  refreshIcons();
}

async function geheZu(k, symbol) {
  if (!SCHIRME.some(s => s[0] === k)) return;
  SCHIRM = k;
  if (symbol) AKTIV = symbol;
  await zeichne();
}

const SPALTEN = [
  ['symbol', 'Symbol', z => `<span class="sym">${esc(z.symbol)}</span> <span class="nm">${esc((z.name || '').slice(0, 20))}</span>`],
  ['kurs', 'Kurs', z => `${z2(z.kurs)} <span class="dim">${esc(z.waehrung || '')}</span>`],
  ['tag', 'Tag %', z => `<span class="${kl(z.tag)}">${pz(z.tag)}</span>`],

  ['m1', '1M %', z => `<span class="${kl(z.m1)}">${pz(z.m1)}</span>`],
  ['m3', '3M %', z => `<span class="${kl(z.m3)}">${pz(z.m3)}</span>`],
  ['j1', '1J %', z => `<span class="${kl(z.j1)}">${pz(z.j1)}</span>`],
  ['rsi', 'RSI', z => z.rsi === null ? '–' :
    `<span class="${z.rsi >= 70 ? 'ab' : z.rsi <= 30 ? 'auf' : 'neutr'}">${z2(z.rsi, 1)}</span>`],
  ['vola', 'Vola %', z => z2(z.vola, 1)],
  ['unter_hoch', 'z. Hoch %', z => `<span class="${kl(z.unter_hoch)}">${pz(z.unter_hoch)}</span>`],
  ['bollinger_lage', 'Band', z => z.bollinger_lage === null ? '–' : `${z2(z.bollinger_lage, 0)} %`],
  ['kgv', 'KGV', z => z2(z.kgv, 1)],
  ['wert_eur', 'Wert €', z => z.wert_eur === null ? '–' : gr(z.wert_eur)],
  ['ergebnis_prozent', 'Erg. %', z => `<span class="${kl(z.ergebnis_prozent)}">${pz(z.ergebnis_prozent)}</span>`],
];

function sortiere(feld) {
  if (SORT.feld === feld) SORT.ab = !SORT.ab; else { SORT.feld = feld; SORT.ab = true; }
  schirmMonitor();
}

function funke(werte, breit = 60, hoch = 16) {
  if (!werte || werte.length < 2) return '';
  const min = Math.min(...werte), max = Math.max(...werte), sp = (max - min) || 1;
  const p = werte.map((w, i) => `${(i / (werte.length - 1) * breit).toFixed(1)},${(hoch - ((w - min) / sp) * hoch).toFixed(1)}`).join(' ');
  const auf = werte[werte.length - 1] >= werte[0];
  return `<svg viewBox="0 0 ${breit} ${hoch}" style="width:${breit}px;height:${hoch}px;vertical-align:middle">
    <polyline points="${p}" fill="none" stroke="${auf ? 'var(--t-auf)' : 'var(--t-ab)'}" stroke-width="1"
              vector-effect="non-scaling-stroke"/></svg>`;
}

async function schirmMonitor() {
  const haupt = document.getElementById('haupt'), seite = document.getElementById('seite');
  if (!MONITOR) { haupt.innerHTML = '<div class="tm-leer">Lade…</div>'; return; }
  const zeilen = [...(MONITOR.zeilen || [])].sort((a, b) => {
    const x = a[SORT.feld], y = b[SORT.feld];
    if (x === null || x === undefined) return 1;
    if (y === null || y === undefined) return -1;
    const v = typeof x === 'string' ? String(x).localeCompare(String(y)) : x - y;
    return SORT.ab ? -v : v;
  });

  haupt.innerHTML = `
    <div class="tm-titel">Monitor — alle verfolgten Werte <span class="zahl">${zeilen.length}</span></div>
    <table class="tm-t">
      <tr>${SPALTEN.map(([f, t]) => `<th class="${SORT.feld === f ? 'an' : ''}" onclick="sortiere('${f}')">
        ${t}${SORT.feld === f ? (SORT.ab ? ' ▾' : ' ▴') : ''}</th>`).join('')}<th>Verlauf</th></tr>
      ${zeilen.map(z => `<tr class="${AKTIV === z.symbol ? 'aktiv' : ''}" onclick="geheZu('WRT','${esc(z.symbol)}')">
        ${SPALTEN.map(([f, t, fn]) => `<td>${fn(z)}</td>`).join('')}
        <td>${funke(z.spur)}</td>
      </tr>`).join('')}
    </table>
    <div class="tm-hint">RSI, Volatilität, Bandlage und Perioden stammen aus dem eigenen Kursspeicher —
      keine fremde Bewertung, nur Rechnung auf den gespeicherten Kursen. Spalten sind sortierbar.</div>`;

  const auffaellig = zeilen.filter(z => z.rsi !== null && (z.rsi >= 70 || z.rsi <= 30));
  seite.innerHTML = `
    <div class="tm-titel">Ablesbare Auffälligkeiten <span class="zahl">${auffaellig.length}</span></div>
    ${auffaellig.length ? auffaellig.map(z => `<div class="tm-zeile" style="cursor:pointer" onclick="geheZu('WRT','${esc(z.symbol)}')">
      <span class="sym">${esc(z.symbol)}</span>
      <span class="${z.rsi >= 70 ? 'ab' : 'auf'}">RSI ${z2(z.rsi, 0)}</span></div>`).join('')
      : '<div class="tm-leer">Nichts außerhalb 30–70.</div>'}
    <div class="tm-titel">Unter Reihenhoch</div>
    ${zeilen.filter(z => z.unter_hoch !== null).sort((a, b) => a.unter_hoch - b.unter_hoch).slice(0, 8)
      .map(z => `<div class="tm-zeile" style="cursor:pointer" onclick="geheZu('WRT','${esc(z.symbol)}')">
        <span class="sym">${esc(z.symbol)}</span><span class="${kl(z.unter_hoch)}">${pz(z.unter_hoch)} %</span></div>`).join('')}
    <div class="tm-hint">RSI über 70 oder unter 30 ist eine <b>Feststellung</b> über die Kursreihe,
      keine Aussage darüber, was zu tun wäre.</div>`;
}

}

// Fehlt der Live-Kurs, tritt der letzte gespeicherte Schlusskurs an seine
// Stelle – datiert. Ein leeres Terminal wäre nicht ehrlicher, nur nutzloser.
function kursLage(d) {
  if (d?.kurs) return { ...d.kurs, live: true };
  const v = d?.verlauf || [];
  if (!v.length) return null;
  const l = v[v.length - 1];
  return { aktuell: l.kurs, veraenderung: null, veraenderung_prozent: l.veraenderung_prozent ?? null,
           eroeffnung: l.eroeffnung, hoch: l.hoch, tief: l.tief,
           vortag: v.length > 1 ? v[v.length - 2].kurs : null, live: false, datum: l.datum };
}

      <span style="width:10px"></span>

function chartGross() {
  const v = DETAIL?.verlauf || [];
  const r = ZEITRAUM ? v.slice(-ZEITRAUM) : v;
  const w = r.map(p => p.kurs);

  // Gleitende Durchschnitte als eigene Reihen – dieselbe Tagesachse.
  const smaReihe = (f, farbe, name) => {
    if (r.length < f) return null;
    const pkt = [];
    for (let i = f - 1; i < r.length; i++) {
      pkt.push({ datum: r[i].datum, kurs: w.slice(i - f + 1, i + 1).reduce((a, x) => a + x, 0) / f });
    }
    return { name, farbe, punkte: pkt, dick: 1, strich: '4 3', deckung: .85 };
  };

  const reihen = [{ name: DETAIL?.symbol || 'Kurs', farbe: w[w.length - 1] >= w[0] ? '#3fd68c' : '#ff6b6b', punkte: r }];
  if (LINIEN.sma20)  { const x = smaReihe(20, '#58a6ff', 'SMA 20');  if (x) reihen.push(x); }
  if (LINIEN.sma50)  { const x = smaReihe(50, '#c084fc', 'SMA 50');  if (x) reihen.push(x); }
  if (LINIEN.sma200) { const x = smaReihe(200, '#f0b429', 'SMA 200'); if (x) reihen.push(x); }
  if (LINIEN.bollinger && r.length >= 20) {
    const ob = [], un = [];
    for (let i = 19; i < r.length; i++) {
      const t = w.slice(i - 19, i + 1);
      const m = t.reduce((a, x) => a + x, 0) / 20;
      const sd = Math.sqrt(t.reduce((a, x) => a + (x - m) ** 2, 0) / 20);
      ob.push({ datum: r[i].datum, kurs: m + 2 * sd });
      un.push({ datum: r[i].datum, kurs: m - 2 * sd });
    }
    reihen.push({ name: 'Band oben', farbe: '#58a6ff', punkte: ob, dick: .8, deckung: .45 });
    reihen.push({ name: 'Band unten', farbe: '#58a6ff', punkte: un, dick: .8, deckung: .45 });
  }

  const wandel = w.length > 1 && w[0] ? ((w[w.length - 1] - w[0]) / w[0]) * 100 : 0;
  return chartBauen({
    id: 'wrt', reihen, hoehe: 320, flaechen: reihen.length === 1,
    yLabel: `${r.length} Handelstage im Zeitraum · ${wandel >= 0 ? '+' : ''}${wandel.toFixed(1)} % · Werte in ${DETAIL?.stammdaten?.waehrung || ''}`,
  });
}

function zurVergleich(sym) {
  if (!VGL_WAHL.includes(sym)) VGL_WAHL.push(sym);
  geheZu('VGL');
}

async function schirmVergleich() {
  const haupt = document.getElementById('haupt'), seite = document.getElementById('seite');
  const alle = (MONITOR?.zeilen || []).map(z => z.symbol);
  if (!VGL_WAHL.length) VGL_WAHL = alle.slice(0, 3);

  // Verläufe der gewählten Werte holen – aus dem Speicher, nicht extern.
  const daten = {};
  for (const s of VGL_WAHL) {
    const p = (UEBER?.positionen || []).concat(UEBER?.beobachtet || []).find(x => x.symbol === s);
    if (p?.verlauf?.length) daten[s] = p.verlauf;
  }
  const vorhanden = Object.keys(daten).filter(s => daten[s].length > 2);

  const farben = ['#f0b429', '#58a6ff', '#3fd68c', '#c084fc', '#ff6b6b', '#22d3ee'];
  const reihen = vorhanden.map((s, i) => ({
    name: s, farbe: farben[i % farben.length],
    punkte: ZEITRAUM ? daten[s].slice(-ZEITRAUM) : daten[s],
  }));
  const chart = reihen.length
    ? chartBauen({ id: 'vgl', reihen, hoehe: 340, normiert: true, flaechen: false,
        yLabel: 'alle Reihen am Startpunkt auf 100 gesetzt — der Abstand zeigt die relative Entwicklung' })
    : '<div class="tm-leer">Mindestens einen Wert mit Verlauf wählen.</div>';

  const legende = reihen.length ? `<div style="display:flex;flex-wrap:wrap;gap:14px;padding:0 12px 10px;font-size:10.5px">
    ${reihen.map(r => {
      const w = r.punkte.map(p => p.kurs);
      const e = w.length > 1 && w[0] ? ((w[w.length - 1] - w[0]) / w[0]) * 100 : 0;
      return `<span><span style="display:inline-block;width:9px;height:2px;background:${r.farbe};
        margin-right:5px;vertical-align:middle"></span><span class="sym">${esc(r.name)}</span>
        <span class="${kl(e)}">${pz(e)} %</span></span>`;
    }).join('')}</div>` : '';

  haupt.innerHTML = `
    <div class="tm-titel">Vergleich — normiert auf 100 <span class="zahl">${vorhanden.length} Werte</span></div>
    <div style="padding:8px 12px;display:flex;gap:5px;flex-wrap:wrap">
      ${[[22, '1M'], [66, '3M'], [132, '6M'], [252, '1J'], [0, 'MAX']].map(([n, l]) =>
        `<button class="knopf ${ZEITRAUM === n ? 'an' : ''}" onclick="ZEITRAUM=${n};schirmVergleich()">${l}</button>`).join('')}
    </div>
    ${chart}${legende}
    <div class="tm-hint">Normierung bedeutet: jede Reihe startet bei 100. Der Abstand zeigt die
      <b>relative</b> Entwicklung im gewählten Zeitraum, nicht den Kurs. Verglichen wird nur über Tage,
      an denen alle gewählten Werte einen Kurs haben.</div>`;

  seite.innerHTML = `
    <div class="tm-titel">Werte wählen <span class="zahl">${VGL_WAHL.length}</span></div>
    ${alle.map(s => `<div class="tm-zeile" style="cursor:pointer" onclick="vglUmschalten('${esc(s)}')">
      <span class="${VGL_WAHL.includes(s) ? 'sym' : 'dim'}">${VGL_WAHL.includes(s) ? '■' : '□'} ${esc(s)}</span>
      <span class="dim">${(MONITOR.zeilen.find(z => z.symbol === s)?.punkte) || 0}T</span></div>`).join('')}
    <div style="padding:10px 12px"><button class="knopf" onclick="VGL_WAHL=[];schirmVergleich()">Auswahl leeren</button></div>`;
}

function vglUmschalten(s) {
  VGL_WAHL = VGL_WAHL.includes(s) ? VGL_WAHL.filter(x => x !== s) : [...VGL_WAHL, s];
  schirmVergleich();
}

// RIS — Risiko
// ════════════════════════════════════════════════════════════════
async function schirmRisiko() {
  const haupt = document.getElementById('haupt'), seite = document.getElementById('seite');
  haupt.innerHTML = '<div class="tm-leer">Rechne…</div>';
  if (!KORR) KORR = await api('/api/agentur/boerse/korrelation?tage=250');

  const pos = (UEBER?.positionen || []).filter(p => p.wert !== null);
  const gesamt = pos.reduce((a, p) => a + p.wert, 0) || 1;
  const sortiert = [...pos].sort((a, b) => b.wert - a.wert);
  const top3 = sortiert.slice(0, 3).reduce((a, p) => a + p.wert, 0) / gesamt * 100;

  // Die Diagonale ist die Korrelation eines Werts mit sich selbst – immer 1
  // und ohne Aussage. Sie einzufärben würde Klumpen vortäuschen, wo keine sind.
  const farbeKorr = (v, diagonal) => diagonal ? 'rgba(255,255,255,.04)'
    : v === null ? 'var(--t-panel)'
    : v > 0.7 ? 'rgba(255,107,107,.55)' : v > 0.4 ? 'rgba(240,180,41,.4)'
    : v > 0 ? 'rgba(255,255,255,.08)' : 'rgba(63,214,140,.28)';

  const m = KORR?.matrix || [], sy = KORR?.symbole || [];

  haupt.innerHTML = `
    <div class="tm-kacheln tm-block">
      <div class="tm-kachel"><div class="tm-k-name">Klumpen Top 3</div>
        <div class="tm-k-wert ${top3 > 60 ? 'ab' : top3 > 40 ? '' : 'auf'}">${top3.toFixed(0)} %</div>
        <div class="tm-k-neben">des bewerteten Depots</div></div>
      <div class="tm-kachel"><div class="tm-k-name">Größte Einzelposition</div>
        <div class="tm-k-wert">${sortiert[0] ? (sortiert[0].wert / gesamt * 100).toFixed(0) + ' %' : '–'}</div>
        <div class="tm-k-neben">${esc(sortiert[0]?.symbol || '')}</div></div>
      <div class="tm-kachel"><div class="tm-k-name">Höchste Vola</div>
        ${(() => { const z = [...(MONITOR?.zeilen || [])].filter(x => x.vola !== null).sort((a, b) => b.vola - a.vola)[0];
          return `<div class="tm-k-wert">${z ? z2(z.vola, 0) + ' %' : '–'}</div><div class="tm-k-neben">${esc(z?.symbol || '')}</div>`; })()}</div>
      <div class="tm-kachel"><div class="tm-k-name">Gemeinsame Tage</div>
        <div class="tm-k-wert">${KORR?.gemeinsame_tage ?? '–'}</div>
        <div class="tm-k-neben">Grundlage der Korrelation</div></div>
    </div>

    <div class="tm-block">
      <div class="tm-titel">Korrelation der Tagesrenditen</div>
      ${sy.length >= 2 && m.length ? `<div style="padding:10px 12px;overflow-x:auto">
        <table class="tm-t" style="font-size:10px">
          <tr><th></th>${sy.map(s => `<th style="text-align:center">${esc(s)}</th>`).join('')}</tr>
          ${sy.map((a, i) => `<tr><td class="sym">${esc(a)}</td>
            ${sy.map((b, j) => `<td style="text-align:center;background:${farbeKorr(m[i][j], i === j)};
              color:${i === j ? 'var(--t-text3)' : Math.abs(m[i][j] ?? 0) > 0.5 ? '#fff' : 'var(--t-text2)'}">
              ${i === j ? '·' : m[i][j] === null ? '–' : m[i][j].toFixed(2)}</td>`).join('')}</tr>`).join('')}
        </table></div>` : `<div class="tm-leer">${esc(KORR?.hinweis || 'Zu wenige Werte mit Verlauf.')}</div>`}
    </div>

    ${KORR?.engste?.length ? `<div class="tm-block">
      <div class="tm-titel">Engster Gleichlauf</div>
      ${KORR.engste.map(p => `<div class="tm-zeile"><span>${esc(p.a)} / ${esc(p.b)}</span>
        <span class="${p.wert > 0.7 ? 'ab' : ''}">${p.wert.toFixed(2)}</span></div>`).join('')}
    </div>` : ''}

    <div class="tm-hint">Korrelation misst, wie stark zwei Werte an denselben Tagen in dieselbe Richtung liefen.
      Nahe 1 heißt Gleichlauf — solche Positionen streuen das Risiko kaum, auch wenn sie in verschiedenen
      Branchen stehen. Nahe 0 heißt unabhängig, negativ heißt gegenläufig. Grundlage sind
      ${KORR?.gemeinsame_tage ?? 0} Tage, an denen alle Werte einen Kurs hatten.</div>`;

  seite.innerHTML = `
    <div class="tm-titel">Volatilität</div>
    ${[...(MONITOR?.zeilen || [])].filter(z => z.vola !== null).sort((a, b) => b.vola - a.vola)
      .map(z => `<div class="tm-zeile" style="cursor:pointer" onclick="geheZu('WRT','${esc(z.symbol)}')">
        <span class="sym">${esc(z.symbol)}</span><span>${z2(z.vola, 1)} %</span></div>`).join('')}
    <div class="tm-titel">Abstand zum Reihenhoch</div>
    ${[...(MONITOR?.zeilen || [])].filter(z => z.unter_hoch !== null).sort((a, b) => a.unter_hoch - b.unter_hoch)
      .map(z => `<div class="tm-zeile" style="cursor:pointer" onclick="geheZu('WRT','${esc(z.symbol)}')">
        <span class="sym">${esc(z.symbol)}</span><span class="${kl(z.unter_hoch)}">${pz(z.unter_hoch)} %</span></div>`).join('')}`;
}

async function schirmKalender() {
  const haupt = document.getElementById('haupt'), seite = document.getElementById('seite');
  if (!KALENDER) KALENDER = await api('/api/agentur/boerse/kalender');
  const t = KALENDER?.termine || [];

  haupt.innerHTML = `
    <div class="tm-titel">Anstehende Termine <span class="zahl">${t.length}</span></div>
    ${t.length ? `<table class="tm-t">
      <tr><th>Datum</th><th>in Tagen</th><th>Symbol</th><th>Name</th><th>Bestand</th></tr>
      ${t.map(x => `<tr onclick="geheZu('WRT','${esc(x.symbol)}')">
        <td style="text-align:left">${esc(x.naechste_zahlen)}</td>
        <td class="${x.in_tagen <= 7 ? 'ab' : x.in_tagen <= 30 ? 'm-akz' : ''}">${x.in_tagen}</td>
        <td><span class="sym">${esc(x.symbol)}</span></td>
        <td style="text-align:left" class="nm">${esc(x.name || '')}</td>
        <td>${x.gehalten ? `<span class="marke2 m-akz">${z2(x.stueck, 0)} Stück</span>` : '<span class="dim">beobachtet</span>'}</td>
      </tr>`).join('')}</table>` : `<div class="tm-leer">${esc(KALENDER?.hinweis || 'Keine Termine.')}</div>`}
    <div class="tm-hint">Termine stammen aus den gespeicherten Stammdaten und werden mit „Kurse holen“
      aufgefrischt. Vor Quartalszahlen schwanken Kurse erfahrungsgemäß stärker — das ist eine
      Beobachtung über Märkte allgemein, keine Aussage über diesen Wert.</div>`;

  const naechste = t.filter(x => x.in_tagen <= 30);
  seite.innerHTML = `
    <div class="tm-titel">Nächste 30 Tage <span class="zahl">${naechste.length}</span></div>
    ${naechste.length ? naechste.map(x => `<div class="tm-zeile" style="cursor:pointer" onclick="geheZu('WRT','${esc(x.symbol)}')">
      <span class="sym">${esc(x.symbol)}</span><span class="${x.in_tagen <= 7 ? 'ab' : ''}">in ${x.in_tagen} T</span></div>`).join('')
      : '<div class="tm-leer">Nichts in den nächsten 30 Tagen.</div>'}`;
}

// NEW — Meldungen
// ════════════════════════════════════════════════════════════════
async function schirmMeldungen() {
  const haupt = document.getElementById('haupt'), seite = document.getElementById('seite');
  if (!STROM) {
    haupt.innerHTML = '<div class="tm-leer">Hole Meldungen…</div>';
    STROM = await api('/api/agentur/boerse/nachrichtenstrom?werte=8&tage=10');
  }
  const m = STROM?.meldungen || [];
  const nachTag = {};
  for (const x of m) (nachTag[x.datum] ||= []).push(x);

  haupt.innerHTML = `
    <div class="tm-titel">Meldungen über alle Positionen <span class="zahl">${m.length}</span></div>
    ${Object.entries(nachTag).map(([tag, liste]) => `
      <div style="padding:8px 12px 4px;font-size:9.5px;letter-spacing:.12em;color:var(--t-akzent);
                  border-bottom:1px solid var(--t-linie);background:var(--t-panel)">${esc(tag)}</div>
      ${liste.map(x => `<div style="padding:7px 12px;border-bottom:1px solid rgba(255,255,255,.035)">
        <div style="display:flex;gap:8px;align-items:baseline">
          <span class="sym" style="cursor:pointer;flex-shrink:0" onclick="geheZu('WRT','${esc(x.symbol)}')">${esc(x.symbol)}</span>
          <a href="${esc(x.url)}" target="_blank" rel="noopener"
             style="color:var(--t-text);text-decoration:none;font-family:'Syne',sans-serif;font-size:12px;line-height:1.4">${esc(x.schlagzeile)}</a>
        </div>
        <div class="dim" style="font-size:9.5px;margin-top:2px;padding-left:calc(1ch * ${x.symbol.length} + 8px)">${esc(x.quelle || '')}</div>
      </div>`).join('')}`).join('') || '<div class="tm-leer">Keine Meldungen.</div>'}
    ${STROM?.fehlt ? `<div class="tm-hint tm-warn">Nicht abgerufen: ${STROM.fehlt.map(esc).join(' · ')}</div>` : ''}
    <div class="tm-hint">Abgefragt wurden die ${STROM?.abgefragt || 0} größten von ${STROM?.von || 0} Positionen —
      jeder Wert kostet einen Abruf beim Anbieter, deshalb bewusst begrenzt.</div>`;

  seite.innerHTML = `
    <div class="tm-titel">Meldungen je Wert</div>
    ${Object.entries(m.reduce((a, x) => { a[x.symbol] = (a[x.symbol] || 0) + 1; return a; }, {}))
      .sort((a, b) => b[1] - a[1])
      .map(([s, n]) => `<div class="tm-zeile" style="cursor:pointer" onclick="geheZu('WRT','${esc(s)}')">
        <span class="sym">${esc(s)}</span><span>${n}</span></div>`).join('') || '<div class="tm-leer">–</div>'}
    <div style="padding:10px 12px"><button class="knopf" onclick="STROM=null;schirmMeldungen()">Neu laden</button></div>`;
}

// KI — Agentur
// ════════════════════════════════════════════════════════════════
async function schirmAgentur() {
  const haupt = document.getElementById('haupt'), seite = document.getElementById('seite');
  if (!AGENTUR) {
    haupt.innerHTML = '<div class="tm-leer">Lade…</div>';
    const [ber, bef, auf, laeufe] = await Promise.all([
      api('/api/agentur/berichte?abteilung=boerse&limit=25'),
      api('/api/agentur/befunde?abteilung=boerse&status=offen'),
      api('/api/agentur/aufgaben?abteilung=boerse'),
      api('/api/agentur/laeufe?abteilung=boerse&limit=15'),
    ]);
    AGENTUR = { berichte: ber?.berichte || [], befunde: bef?.befunde || [],
                aufgaben: auf?.aufgaben || [], laeufe: laeufe?.laeufe || [] };
  }
  const a = AGENTUR;

  haupt.innerHTML = `
    <div class="tm-block">
      <div class="tm-titel">Befunde <span class="zahl">${a.befunde.length}</span></div>
      ${a.befunde.length ? a.befunde.map(b => `<div style="padding:8px 12px;border-bottom:1px solid rgba(255,255,255,.035)">
        <div style="display:flex;gap:8px;align-items:baseline">
          <span class="marke2 ${b.schwere === 'hoch' ? 'm-ab' : b.schwere === 'niedrig' ? 'm-neu' : 'm-akz'}">${esc(b.schwere)}</span>
          <span style="font-family:'Syne',sans-serif;font-size:12.5px">${esc(b.titel)}</span></div>
        ${b.beleg ? `<div class="dim" style="font-size:10px;margin-top:3px">${esc(b.beleg)}</div>` : ''}
        <div class="dim" style="font-size:9.5px;margin-top:3px">${esc(b.autor || '')} · ${esc(fmtDate(b.erstellt_am))}</div>
      </div>`).join('') : '<div class="tm-leer">Keine offenen Befunde.</div>'}
    </div>

    <div class="tm-block">
      <div class="tm-titel">Berichte <span class="zahl">${a.berichte.length}</span></div>
      ${a.berichte.length ? a.berichte.map(b => `<div style="padding:8px 12px;border-bottom:1px solid rgba(255,255,255,.035)">
        <div style="font-family:'Syne',sans-serif;font-size:12.5px;cursor:pointer"
             onclick="const e=document.getElementById('ki${b.id}');e.style.display=e.style.display==='none'?'block':'none'">
          ${esc(b.titel || 'Ohne Titel')}</div>
        <div class="dim" style="font-size:9.5px">${esc(b.autor || '')} · ${esc(fmtDate(b.erstellt_am))}
          ${b.lauf_id ? '· Lauf #' + b.lauf_id : ''}</div>
        <div class="md" id="ki${b.id}" style="display:none;margin-top:8px">${mdToHtml(b.text)}</div>
      </div>`).join('') : `<div class="tm-leer">Noch keine Berichte. Robert, Ines und Malte schreiben sie,
        sobald ihre Aufgaben fällig werden.</div>`}
    </div>`;

  seite.innerHTML = `
    <div class="tm-titel">Analyse anfordern</div>
    <div style="padding:10px 12px;display:flex;flex-direction:column;gap:6px">
      ${AKTIV ? `<button class="knopf" onclick="analyseAnfordern()">Faktenbericht ${esc(AKTIV)}</button>` : ''}
      <button class="knopf" onclick="auftragAn('malte','Depot durchsehen','Gehaltene Werte gegen die Schwellen prüfen.')">Depot durchsehen (Malte)</button>
      <button class="knopf" onclick="auftragAn('ines','Nachrichtenlage','Meldungen zu den verfolgten Werten sammeln.')">Nachrichtenlage (Ines)</button>
      <div id="ki-status" style="font-size:10px;color:var(--t-text3);line-height:1.5"></div>
    </div>

    <div class="tm-titel">Offene Aufgaben <span class="zahl">${a.aufgaben.length}</span></div>
    ${a.aufgaben.length ? a.aufgaben.map(x => `<div class="tm-zeile">
      <span>${esc((x.titel || '').slice(0, 22))}</span><span class="dim">${esc(x.zustaendig || '–')}</span></div>`).join('')
      : '<div class="tm-leer">Keine.</div>'}

    <div class="tm-titel">Letzte Läufe</div>
    ${a.laeufe.length ? a.laeufe.slice(0, 8).map(l => `<div class="tm-zeile">
      <span>${esc(l.mitarbeiter_name || l.mitarbeiter_id)}</span>
      <span class="${l.status === 'erfolgreich' ? 'auf' : l.status === 'fehlgeschlagen' ? 'ab' : 'dim'}">${esc(l.status)}</span>
    </div>`).join('') : '<div class="tm-leer">Noch keine Läufe.</div>'}

    <div class="tm-hint">Die Analysten liefern <b>Fakten</b>: Zahlen mit Stichtag, Meldungen mit Quelle,
      Ereignisse an gehaltenen Werten. Keine Kauf-, Verkaufs- oder Halteempfehlung — das steht so in
      ihren Anweisungen.</div>`;
}

async function auftragAn(wer, titel, beschreibung) {
  const el = document.getElementById('ki-status');
  const r = await api('/api/agentur/aufgaben', { method: 'POST', body: {
    abteilung_id: 'boerse', titel, beschreibung, zustaendig: wer, status: 'offen',
    faellig_am: new Date().toISOString(), erstellt_von: 'mensch',
  }});
  if (el) el.textContent = r?.id ? `Beauftragt (#${r.id}) — der Verteiler startet den Lauf innerhalb der nächsten Stunde.`
                                 : 'Auftrag fehlgeschlagen.';
}

async function analyseAnfordern() {
  if (!AKTIV) return;
  await auftragAn('robert', `Faktenbericht ${AKTIV}`,
    `Kurse, Kennzahlen, Termine und Verlauf zu ${AKTIV} zusammentragen. Keine Empfehlung.`);
}

// ════════════════════════════════════════════════════════════════
// Kommandozeile und Tastatur
// ════════════════════════════════════════════════════════════════
let VOR = [], VOR_I = -1, VOR_WARTE = null;

function cmdTippen() {
  const q = document.getElementById('cmd').value.trim();
  const box = document.getElementById('cmd-vor');
  clearTimeout(VOR_WARTE);

  // Erst die eigenen Werte und Schirmkürzel – das ist sofort da.
  const eigen = (MONITOR?.zeilen || [])
    .filter(z => z.symbol.toUpperCase().includes(q.toUpperCase()) || (z.name || '').toUpperCase().includes(q.toUpperCase()))
    .map(z => ({ symbol: z.symbol, name: z.name, art: 'eigen' }));
  const schirme = SCHIRME.filter(s => s[0].startsWith(q.toUpperCase()) || s[1].toUpperCase().startsWith(q.toUpperCase()))
    .map(s => ({ symbol: s[0], name: 'Schirm: ' + s[1], art: 'schirm' }));

  VOR = [...schirme, ...eigen];
  if (q.length >= 2) {
    VOR_WARTE = setTimeout(async () => {
      const d = await api('/api/agentur/boerse/suche?q=' + encodeURIComponent(q));
      const fremd = (d?.treffer || []).filter(t => !eigen.some(e => e.symbol === t.symbol))
        .map(t => ({ symbol: t.symbol, name: t.name, art: 'fremd' }));
      VOR = [...schirme, ...eigen, ...fremd];
      malVorschlaege();
    }, 220);
  }
  malVorschlaege();
}

function malVorschlaege() {
  const box = document.getElementById('cmd-vor');
  if (!VOR.length) { box.style.display = 'none'; return; }
  box.innerHTML = VOR.slice(0, 14).map((t, i) => `<div class="tm-vor-z ${i === VOR_I ? 'an' : ''}"
    onmousedown="waehleVor(${i})"><b>${esc(t.symbol)}</b><i>${esc(t.name || '')}${t.art === 'fremd' ? ' · nicht verfolgt' : ''}</i></div>`).join('');
  box.style.display = 'block';
}

function waehleVor(i) {
  const t = VOR[i]; if (!t) return;
  document.getElementById('cmd').value = '';
  document.getElementById('cmd-vor').style.display = 'none';
  VOR = []; VOR_I = -1;
  if (t.art === 'schirm') geheZu(t.symbol);
  else { DETAIL = null; geheZu('WRT', t.symbol); }
}

function cmdTaste(e) {
  const box = document.getElementById('cmd-vor');
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    if (!VOR.length) return;
    e.preventDefault();
    VOR_I += e.key === 'ArrowDown' ? 1 : -1;
    if (VOR_I < 0) VOR_I = VOR.length - 1;
    if (VOR_I >= VOR.length) VOR_I = 0;
    malVorschlaege();
    return;
  }
  if (e.key === 'Enter') {
    e.preventDefault();
    if (VOR_I >= 0) return waehleVor(VOR_I);
    const v = document.getElementById('cmd').value.trim().toUpperCase();
    if (!v) return;
    document.getElementById('cmd').value = '';
    box.style.display = 'none'; VOR = []; VOR_I = -1;
    if (SCHIRME.some(s => s[0] === v)) geheZu(v);
    else { DETAIL = null; geheZu('WRT', v); }
    return;
  }
  if (e.key === 'Escape') { box.style.display = 'none'; document.getElementById('cmd').blur(); }
}

document.addEventListener('keydown', e => {
  const imFeld = ['INPUT', 'TEXTAREA'].includes(document.activeElement?.tagName);
  if ((e.key === '/' || e.key === 'F1') && !imFeld) { e.preventDefault(); document.getElementById('cmd').focus(); return; }
  if (imFeld) return;
  // Zahlen springen die Schirme an
  const i = Number(e.key) - 1;
  if (i >= 0 && i < SCHIRME.length) { geheZu(SCHIRME[i][0]); return; }
  if ((e.key === 'ArrowDown' || e.key === 'ArrowUp') && MONITOR?.zeilen?.length) {
    e.preventDefault();
    const alle = MONITOR.zeilen.map(z => z.symbol);
    const k = alle.indexOf(AKTIV);
    AKTIV = alle[e.key === 'ArrowDown' ? (k + 1) % alle.length : (k - 1 + alle.length) % alle.length];
    DETAIL = null;
    if (SCHIRM === 'WRT') schirmWert(); else zeichne();
  }
});

// ── Start ───────────────────────────────────────────────────────
async function boot() {
  initLayout(null);
  await ladeGrunddaten();
  await zeichne();
  setInterval(async () => {
    if (document.hidden) return;
    document.getElementById('st-led').style.background = 'var(--t-akzent)';
    await ladeGrunddaten();
    document.getElementById('st-led').style.background = 'var(--t-auf)';
    if (SCHIRM === 'DEP' || SCHIRM === 'MON') zeichne();
  }, 120000);
}
injectLoginScreen();
checkAuth(boot);
window.initAfterLogin = boot;
</script>
