  const liste = team.map(m => {
    const f = funktion(m.funktion_id);
    return `<div class="zeile" style="cursor:default">
      <div class="zeile-kopf">
        <div style="width:44px;flex-shrink:0">${avatarSvg(m).replace('width:66px', '')}</div>
        <div style="flex:1;min-width:0">
          <div class="zeile-titel">${esc(m.name)}${!m.aktiv ? ' <span class="marke m-grau">beurlaubt</span>' : ''}</div>
          <div class="zeile-sub">${esc(m.charakter || f?.beschreibung || '')}</div>
          <div class="zeile-meta">
            <span class="marke m-blau">${esc(f?.name || m.funktion_id)}</span>
            <span style="font-size:10.5px;color:var(--text3);font-family:'Space Mono',monospace">${esc(m.charakter_datei || '')}</span>
          </div>
        </div>
      </div>
      <div style="display:flex;gap:8px;margin-top:11px">
        <button class="btn btn-ghost btn-sm" onclick="oeffnePerson('${esc(m.id)}')">${icon('folder-open', 12)} Personalakte</button>
        <button class="btn btn-ghost btn-sm" onclick="beurlauben('${esc(m.id)}',${m.aktiv ? 0 : 1})">
          ${m.aktiv ? icon('pause', 12) + ' Beurlauben' : icon('play', 12) + ' Zurückholen'}
        </button>
      </div>
    </div>`;
  }).join('');

  el.innerHTML = `
    <div class="hinweis">${icon('info', 15)}<span>
      <b>Funktion = Skill, Person = Datensatz.</b> Jemanden einzustellen heißt: eine Zeile hier plus eine Charakterdatei im Agency-Repo.
      Kein neuer Skill, kein Deploy. Fünf Leute im Marketing sind fünf Zeilen.
    </span></div>

    <div class="karte">
      <div class="karte-kopf">${icon('user-plus', 12)} Jemanden einstellen</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <div class="feld"><label>Name</label><input id="neu-name" placeholder="z. B. Sabine"></div>
        <div class="feld"><label>Funktion</label>
          <select id="neu-funktion">${funktionen.map(f => `<option value="${esc(f.id)}">${esc(f.name)}</option>`).join('')}</select>
        </div>
        <div class="feld"><label>Farbe</label><input id="neu-farbe" type="color" value="#3b82f6" style="height:38px;padding:3px"></div>
        <div class="feld"><label>Aussehen</label>
          <select id="neu-avatar">
            <option value="a">Variante A</option><option value="b">Variante B (Brille)</option>
            <option value="c">Variante C</option><option value="d">Variante D (Bart)</option>
            <option value="e">Variante E (Mütze)</option>
          </select>
        </div>
        <div class="feld" style="grid-column:1/-1"><label>Charakter – Tonfall, Priorität bei Konflikt, wovon die Rolle die Finger lässt</label>
          <textarea id="neu-charakter" placeholder="Nüchtern, zahlenfixiert. Jede Aussage mit Zahl, Zeitraum und Quelle."></textarea>
        </div>
      </div>
      <button class="btn btn-primary" onclick="einstellen()">${icon('check', 13)} Einstellen</button>
      <div id="neu-fehler" style="color:#f87171;font-size:11.5px;margin-top:9px"></div>
    </div>

    <div style="margin-top:20px">${liste || '<div class="leer">Noch niemand eingestellt.</div>'}</div>`;
}

async function einstellen() {
  const name = document.getElementById('neu-name').value.trim();
  const fehler = document.getElementById('neu-fehler');
  fehler.textContent = '';
  if (!name) { fehler.textContent = 'Name fehlt.'; return; }
  const r = await api('/api/agentur/mitarbeiter', {
    method: 'POST',
    body: {
      name,
      funktion_id: document.getElementById('neu-funktion').value,
      abteilung_id: ABTEILUNG,
      charakter: document.getElementById('neu-charakter').value.trim(),
      farbe: document.getElementById('neu-farbe').value,
      avatar: document.getElementById('neu-avatar').value,
    },
  });
  if (!r) { fehler.textContent = 'Konnte nicht angelegt werden – gibt es die Kennung schon?'; return; }
  await ladeBoard();
  zeigeTab('buero', document.querySelector('.ag-tab'));
}

async function beurlauben(id, aktiv) {
  await api('/api/agentur/mitarbeiter/' + encodeURIComponent(id), { method: 'PATCH', body: { aktiv } });
  ladeBoard();
}

// ── Überlagerung ─────────────────────────────────────────────────
function schliesse() { document.getElementById('ag-overlay').classList.remove('offen'); }

function zeigeDetail(kopf, body, fuss) {
  document.getElementById('det-kopf').innerHTML = kopf;
  document.getElementById('det-body').innerHTML = body;
  document.getElementById('det-fuss').innerHTML = fuss || '';
  document.getElementById('ag-overlay').classList.add('offen');
  refreshIcons();
}

async function oeffnePerson(id) {
  zeigeDetail('<h2>Lade…</h2>', loadingState(), '');
  const d = await api('/api/agentur/mitarbeiter/' + encodeURIComponent(id));
  if (!d) { zeigeDetail('<h2>Fehler</h2>', errState(), ''); return; }
  const m = d.mitarbeiter;
  const kopf = `
    <div style="display:flex;gap:14px;align-items:center">
      <div style="width:56px;flex-shrink:0">${avatarSvg(m)}</div>
      <div>
        <h2>${esc(m.name)}</h2>
        <div class="page-sub">${esc(m.funktion_name || m.funktion_id)} · ${esc(m.abteilung_id)}</div>
      </div>
    </div>`;
  const laeufe = (d.laeufe || []).slice(0, 8).map(l => `
    <div class="verlauf-eintrag">
      <div style="font-size:12px;font-weight:700">Lauf #${l.id} · ${esc(l.status)}</div>
      <div style="font-size:11px;color:var(--text3);font-family:'Space Mono',monospace">${esc(fmtDate(l.gestartet_am))}</div>
      ${l.zusammenfassung ? `<div style="font-size:12px;color:var(--text2);margin-top:4px">${esc(l.zusammenfassung)}</div>` : ''}
      ${l.fehler ? `<div style="font-size:12px;color:#f87171;margin-top:4px">${esc(l.fehler)}</div>` : ''}
    </div>`).join('') || '<div style="color:var(--text3);font-size:12px">Noch kein Lauf.</div>';

  const berichte = (d.eintraege || []).slice(0, 8).map(e => `
    <div class="verlauf-eintrag">
      <div style="font-size:12px;font-weight:700">${esc(e.titel || (ART_MARKE[e.art] || ['', e.art])[1])}</div>
      <div style="font-size:11px;color:var(--text3);font-family:'Space Mono',monospace">${esc(fmtDate(e.erstellt_am))}${e.lauf_id ? ` · Lauf #${e.lauf_id}` : ''}</div>
    </div>`).join('') || '<div style="color:var(--text3);font-size:12px">Noch nichts geschrieben.</div>';

  const body = `
    <div class="karte" style="margin-bottom:16px">
      <div class="karte-kopf">${icon('drama', 12)} Charakter</div>
      <div style="font-size:12.5px;line-height:1.6;color:var(--text2)">${esc(m.charakter || 'Nicht hinterlegt.')}</div>
      ${m.charakter_datei ? `<div style="margin-top:8px;font-family:'Space Mono',monospace;font-size:10.5px;color:var(--text3)">${esc(m.charakter_datei)}</div>` : ''}
    </div>
    <div class="karte" style="margin-bottom:16px">
      <div class="karte-kopf">${icon('list-checks', 12)} Offene Aufgaben <span class="zahl">${(d.aufgaben || []).length}</span></div>
      ${(d.aufgaben || []).map(a => `<div style="font-size:12.5px;padding:5px 0;border-top:1px solid var(--border)">${esc(a.titel)} ${marke(STATUS_MARKE[a.status] || STATUS_MARKE.offen)}</div>`).join('') || '<div style="color:var(--text3);font-size:12px">Nichts offen.</div>'}
    </div>
    <div class="karte" style="margin-bottom:16px">
      <div class="karte-kopf">${icon('activity', 12)} Letzte Läufe</div>${laeufe}
    </div>
    <div class="karte">
      <div class="karte-kopf">${icon('file-text', 12)} Zuletzt geschrieben</div>${berichte}
    </div>`;
  zeigeDetail(kopf, body, '');
}

async function oeffneAufgabe(id) {
  zeigeDetail('<h2>Lade…</h2>', loadingState(), '');
  const d = await api('/api/agentur/aufgaben/' + id);
  if (!d) { zeigeDetail('<h2>Fehler</h2>', errState(), ''); return; }
  const a = d.aufgabe;
  const st = STATUS_MARKE[a.status] || STATUS_MARKE.offen;
  const kopf = `<div style="display:flex;gap:8px;margin-bottom:8px">${marke(st)}${a.modus === 'runde' ? marke(['m-lila', 'Runde']) : ''}</div><h2>${esc(a.titel)}</h2>
    <div class="page-sub">zuständig: ${esc(personName(a.zustaendig))} · angelegt ${esc(fmtDate(a.erstellt_am))}</div>`;

  const verlauf = (d.eintraege || []).map(e => {
    const art = ART_MARKE[e.art] || ART_MARKE.notiz;
    return `<div class="verlauf-eintrag">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">
        ${marke(art)}
        <span style="font-size:11.5px;font-weight:700">${esc(personName(e.mitarbeiter_id))}</span>
        <span style="font-size:10.5px;color:var(--text3);font-family:'Space Mono',monospace">${esc(fmtDate(e.erstellt_am))}${e.lauf_id ? ` · Lauf #${e.lauf_id}` : ''}</span>
      </div>
      ${e.titel ? `<div style="font-size:12.5px;font-weight:700;margin-bottom:3px">${esc(e.titel)}</div>` : ''}
      ${e.text ? `<div class="md">${mdToHtml(e.text)}</div>` : ''}
      ${e.artefakt_url ? `<a href="${esc(e.artefakt_url)}" target="_blank" rel="noopener" style="font-size:11.5px;color:var(--accent2)">${esc(e.artefakt_url)}</a>` : ''}
    </div>`;
  }).join('') || '<div style="color:var(--text3);font-size:12px">Noch kein Verlauf.</div>';

  const body = `
    ${a.beschreibung ? `<div class="md" style="margin-bottom:18px">${mdToHtml(a.beschreibung)}</div>` : ''}
    <div class="karte-kopf">${icon('history', 12)} Verlauf</div>
    ${verlauf}`;

  let fuss = '';
  if (a.status === 'zur_freigabe') {
    fuss = `
      <button class="btn btn-primary" onclick="setzeStatus(${a.id},'erledigt')">${icon('check', 13)} Freigeben</button>
      <button class="btn btn-ghost" onclick="setzeStatus(${a.id},'in_arbeit')">${icon('rotate-ccw', 13)} Zurück in Arbeit</button>
      <button class="btn btn-danger" onclick="setzeStatus(${a.id},'verworfen')">${icon('x', 13)} Verwerfen</button>`;
  } else if (!['erledigt', 'verworfen'].includes(a.status)) {
    fuss = `<button class="btn btn-ghost" onclick="setzeStatus(${a.id},'erledigt')">${icon('check', 13)} Als erledigt markieren</button>
            <button class="btn btn-danger" onclick="setzeStatus(${a.id},'verworfen')">${icon('x', 13)} Verwerfen</button>`;
  }
  zeigeDetail(kopf, body, fuss);
}

async function setzeStatus(id, status) {
  await api('/api/agentur/aufgaben/' + id, { method: 'PATCH', body: { status } });
  schliesse();
  ladeBoard();
}

function oeffneBericht(id) {
  const b = BERICHTE.find(x => x.id === id);
  if (!b) return;
  const art = ART_MARKE[b.art] || ART_MARKE.notiz;
  const kopf = `<div style="margin-bottom:8px">${marke(art)}</div><h2>${esc(b.titel || 'Ohne Titel')}</h2>
    <div class="page-sub">${esc(b.autor || 'unbekannt')} · ${esc(fmtDate(b.erstellt_am))}${b.lauf_id ? ` · Lauf #${b.lauf_id}` : ''}</div>`;
  zeigeDetail(kopf, `<div class="md">${mdToHtml(b.text)}</div>`,
    b.aufgabe_id ? `<button class="btn btn-ghost" onclick="oeffneAufgabe(${b.aufgabe_id})">${icon('external-link', 13)} Zur Aufgabe</button>` : '');
}

function oeffneBefund(id) {
  const b = (BOARD.befunde || []).find(x => x.id === id);
  if (!b) return;
  const art = BEFUND_MARKE[b.art] || BEFUND_MARKE.veraltet;
  const kopf = `<div style="margin-bottom:8px">${marke(art)}</div><h2>${esc(b.titel)}</h2>
    <div class="page-sub">${esc(b.autor || 'unbekannt')} · ${esc(fmtDate(b.erstellt_am))}</div>`;
  const body = `
    ${b.beschreibung ? `<div class="md">${mdToHtml(b.beschreibung)}</div>` : ''}
    ${b.url ? `<div class="karte" style="margin-top:14px"><div class="karte-kopf">${icon('link', 12)} Fundstelle</div>
      <a href="${esc(b.url)}" target="_blank" rel="noopener" style="font-size:12px;color:var(--accent2);word-break:break-all">${esc(b.url)}</a></div>` : ''}
    ${b.beleg ? `<div class="karte"><div class="karte-kopf">${icon('quote', 12)} Beleg</div>
      <div style="font-size:12.5px;line-height:1.6;color:var(--text2);font-style:italic">${esc(b.beleg)}</div></div>` : ''}
    ${b.soll ? `<div class="karte"><div class="karte-kopf">${icon('target', 12)} Soll-Stand</div>
      <div style="font-size:12.5px;line-height:1.6;color:var(--text2)">${esc(b.soll)}</div></div>` : ''}`;
  const fuss = `
    <button class="btn btn-primary" onclick="befundZuAufgabe(${b.id})">${icon('plus', 13)} Aufgabe daraus machen</button>
    <button class="btn btn-ghost" onclick="setzeBefund(${b.id},'erledigt')">${icon('check', 13)} Erledigt</button>
    <button class="btn btn-danger" onclick="setzeBefund(${b.id},'verworfen')">${icon('x', 13)} Verwerfen</button>`;
  zeigeDetail(kopf, body, fuss);
}

async function setzeBefund(id, status) {
  await api('/api/agentur/befunde/' + id, { method: 'PATCH', body: { status } });
  schliesse();
  ladeBoard();
}

async function befundZuAufgabe(id) {
  const b = (BOARD.befunde || []).find(x => x.id === id);
  if (!b) return;
  const r = await api('/api/agentur/aufgaben', {
    method: 'POST',
    body: {
      abteilung_id: b.abteilung_id,
      titel: b.titel,
      beschreibung: [b.beschreibung, b.url ? `\n\nFundstelle: ${b.url}` : '', b.beleg ? `\n\nBeleg: ${b.beleg}` : ''].filter(Boolean).join(''),
      prioritaet: b.schwere === 'hoch' ? 'hoch' : 'normal',
      quelle_befund_id: b.id,
    },
  });
  if (r?.id) await api('/api/agentur/befunde/' + id, { method: 'PATCH', body: { status: 'aufgabe', aufgabe_id: r.id } });
  schliesse();
  ladeBoard();
}

function neueAufgabe() {
  const team = BOARD.team || [];
  const kopf = `<h2>Aufgabe anlegen</h2><div class="page-sub">landet im Board und taucht beim nächsten Lauf der zuständigen Person auf</div>`;
  const body = `
    <div class="feld"><label>Titel</label><input id="na-titel" placeholder="Was soll passieren?"></div>
    <div class="feld"><label>Beschreibung</label><textarea id="na-text" placeholder="Kontext, Ziel, Abgrenzung"></textarea></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
      <div class="feld"><label>Zuständig</label>
        <select id="na-zustaendig"><option value="">– niemand –</option>${team.map(m => `<option value="${esc(m.id)}">${esc(m.name)}</option>`).join('')}</select>
      </div>
      <div class="feld"><label>Priorität</label>
        <select id="na-prio"><option value="normal">normal</option><option value="hoch">hoch</option><option value="niedrig">niedrig</option></select>
      </div>
    </div>
    <div id="na-fehler" style="color:#f87171;font-size:11.5px"></div>`;
  zeigeDetail(kopf, body, `<button class="btn btn-primary" onclick="speichereAufgabe()">${icon('check', 13)} Anlegen</button>`);
}

async function speichereAufgabe() {
  const titel = document.getElementById('na-titel').value.trim();
  if (!titel) { document.getElementById('na-fehler').textContent = 'Titel fehlt.'; return; }
  const zustaendig = document.getElementById('na-zustaendig').value;
  await api('/api/agentur/aufgaben', {
    method: 'POST',
    body: {
      abteilung_id: ABTEILUNG,
      titel,
      beschreibung: document.getElementById('na-text').value.trim(),
      zustaendig: zustaendig || null,
      status: zustaendig ? 'in_arbeit' : 'offen',
      prioritaet: document.getElementById('na-prio').value,
    },
  });
  schliesse();
  ladeBoard();
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') schliesse(); });

// ── Start ────────────────────────────────────────────────────────
function boot() {
  initLayout(null);
  ladeBoard();
  // Das Büro spiegelt den Board-Zustand – alle 60 Sekunden nachschauen.
  setInterval(() => { if (!document.hidden) ladeBoard(); }, 60000);
}
injectLoginScreen();
checkAuth(boot);
window.initAfterLogin = boot;
</script>
</body>
</html>
