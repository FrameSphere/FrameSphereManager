<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agentur – WebControl HQ</title>
  <link rel="stylesheet" href="css/main.css">
  <style>
    /* ── Kopfzeile ─────────────────────────────────────────────── */
    .ag-headbar { display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
    .ag-sel {
      background:var(--bg3); border:1px solid var(--border2); color:var(--text);
      border-radius:8px; padding:6px 10px; font-family:'Space Mono',monospace;
      font-size:11px; font-weight:700; cursor:pointer;
    }
    .ag-chips { display:flex; gap:8px; flex-wrap:wrap; margin-left:auto; }
    .ag-chip {
      display:flex; align-items:center; gap:6px; padding:5px 11px; border-radius:20px;
      background:var(--bg3); border:1px solid var(--border); font-size:11px;
      font-family:'Space Mono',monospace; color:var(--text2); font-weight:700;
    }
    .ag-chip b { color:var(--text); font-size:12px; }
    .ag-chip.warn  { border-color:rgba(245,158,11,.4); color:#fbbf24; }
    .ag-chip.warn b{ color:#fbbf24; }
    .ag-chip.bad   { border-color:rgba(239,68,68,.4);  color:#f87171; }
    .ag-chip.bad b { color:#f87171; }
    .ag-chip.live  { border-color:rgba(34,197,94,.45); color:#4ade80; }
    .ag-chip.live b{ color:#4ade80; }

    .ag-tabs { display:flex; gap:4px; padding:14px 28px 0; border-bottom:1px solid var(--border); flex-shrink:0; overflow-x:auto; }
    .ag-tab {
      padding:9px 16px; font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase;
      background:none; border:none; border-bottom:2px solid transparent; color:var(--text3);
      cursor:pointer; font-family:'Space Mono',monospace; margin-bottom:-1px; white-space:nowrap;
      display:flex; align-items:center; gap:7px; transition:color .15s,border-color .15s;
    }
    .ag-tab.active { color:var(--accent2); border-bottom-color:var(--accent2); }
    .ag-tab:hover:not(.active) { color:var(--text2); }
    .ag-count { font-size:10px; font-weight:800; padding:1px 7px; border-radius:20px; background:rgba(255,255,255,.08); color:var(--text2); }
    .ag-count.hot { background:rgba(245,158,11,.18); color:#fbbf24; }

    .ag-pane { flex:1; overflow-y:auto; padding:20px 28px 40px; display:none; }
    .ag-pane.active { display:block; }

    /* ── Das Büro ──────────────────────────────────────────────── */
    .buero-wrap { display:grid; grid-template-columns:minmax(0,1fr) 300px; gap:18px; align-items:start; }

    .buero {
      position:relative; border-radius:18px; padding:30px 26px 26px;
      background:
        linear-gradient(180deg, rgba(59,130,246,.06), transparent 40%),
        repeating-linear-gradient(90deg, rgba(255,255,255,.022) 0 1px, transparent 1px 46px),
        repeating-linear-gradient(0deg,  rgba(255,255,255,.022) 0 1px, transparent 1px 46px),
        var(--bg2);
      border:1px solid var(--border);
      box-shadow: inset 0 40px 90px -50px rgba(96,165,250,.35), inset 0 -1px 0 rgba(255,255,255,.03);
      overflow:hidden;
    }
    /* Fensterfront oben */
    .buero::before {
      content:''; position:absolute; top:0; left:0; right:0; height:8px;
      background:linear-gradient(90deg, transparent, rgba(96,165,250,.5), transparent);
      opacity:.55;
    }
    .buero-label {
      position:absolute; top:12px; right:18px; font-family:'Space Mono',monospace;
      font-size:9px; letter-spacing:.18em; text-transform:uppercase; color:var(--text3);
    }

    .desks { display:grid; grid-template-columns:repeat(auto-fill, minmax(168px, 1fr)); gap:26px 20px; }

    .desk {
      position:relative; display:flex; flex-direction:column; align-items:center;
      cursor:pointer; padding-top:6px; border:none; background:none; font-family:inherit;
      color:var(--text); /* Buttons erben sonst die Systemfarbe – Namen wären unsichtbar */
      transition:transform .14s;
    }
    .desk:hover { transform:translateY(-3px); }
    .desk:focus-visible { outline:2px solid var(--accent); outline-offset:6px; border-radius:12px; }

    /* Person */
    .fig { position:relative; width:66px; height:56px; margin-bottom:-8px; z-index:2; }
    .fig svg { display:block; width:66px; height:56px; }
    .desk[data-zustand="am_platz"] .fig,
    .desk[data-zustand="offen"]    .fig { animation:atmen 4.5s ease-in-out infinite; }
    .desk[data-zustand="arbeitet"] .fig { animation:tippen 1.1s ease-in-out infinite; }
    .desk[data-zustand="wartet"]   .fig { animation:atmen 2.6s ease-in-out infinite; }
    .desk[data-zustand="haengt"]     .fig,
    .desk[data-zustand="beurlaubt"]  .fig { opacity:0; }

    /* Leerer Stuhl, wenn niemand da ist */
    .leerzeichen {
      position:absolute; top:8px; left:50%; transform:translateX(-50%);
      display:none; align-items:center; justify-content:center; width:40px; height:40px;
      border-radius:10px; border:1px dashed var(--border2); color:var(--text3); z-index:2;
    }
    .desk[data-zustand="haengt"] .leerzeichen,
    .desk[data-zustand="beurlaubt"] .leerzeichen { display:flex; }

    /* Schreibtisch */
    .tisch {
      position:relative; width:100%; height:46px; border-radius:9px;
      background:linear-gradient(180deg, var(--surface2), var(--surface));
      border:1px solid var(--border2);
      box-shadow:0 8px 18px -10px rgba(0,0,0,.9);
      display:flex; align-items:center; justify-content:center;
    }
    .desk[data-zustand="haengt"] .tisch { border-style:dashed; border-color:rgba(239,68,68,.45); }
    .desk[data-zustand="beurlaubt"] .tisch { opacity:.45; }

    /* Monitor */
    .monitor {
      width:44px; height:28px; border-radius:4px; background:var(--bg);
      border:1px solid var(--border2); position:relative; overflow:hidden;
      transition:box-shadow .3s, border-color .3s;
    }
    .monitor::after {
      content:''; position:absolute; inset:3px; border-radius:2px;
      background:linear-gradient(180deg, var(--mfarbe, #3b82f6), transparent);
      opacity:.13; transition:opacity .3s;
    }
    .desk[data-zustand="arbeitet"] .monitor {
      border-color:var(--mfarbe); box-shadow:0 0 18px -2px var(--mfarbe);
      animation:schimmer 2.4s ease-in-out infinite;
    }
    .desk[data-zustand="arbeitet"] .monitor::after { opacity:.55; }
    .desk[data-zustand="haengt"]     .monitor::after,
    .desk[data-zustand="beurlaubt"]  .monitor::after { opacity:.04; }

    /* Papierstapel im Postfach-Zustand */
    .papier {
      position:absolute; right:9px; bottom:11px; width:13px; height:10px; border-radius:2px;
      background:#e8edf5; box-shadow:0 -3px 0 -1px #cbd5e1, 0 -6px 0 -2px #94a3b8; display:none;
    }
    .desk[data-zustand="wartet"] .papier { display:block; animation:wippen 2s ease-in-out infinite; }

    /* Namensschild */
    .schild { margin-top:11px; text-align:center; }
    .schild-name { font-size:13px; font-weight:800; letter-spacing:-.01em; }
    .schild-rolle { font-size:10px; color:var(--text3); font-family:'Space Mono',monospace; margin-top:1px; }
    .zustand {
      margin-top:7px; display:inline-flex; align-items:center; gap:5px;
      font-size:9px; font-family:'Space Mono',monospace; font-weight:700;
      text-transform:uppercase; letter-spacing:.07em; padding:2px 8px; border-radius:20px;
      background:rgba(255,255,255,.05); color:var(--text3);
    }
    .zustand .punkt { width:5px; height:5px; border-radius:50%; background:currentColor; }
    .z-arbeitet  { background:rgba(34,197,94,.14);  color:#4ade80; }
    .z-arbeitet .punkt { animation:pochen 1.4s ease-in-out infinite; }
    .z-wartet    { background:rgba(245,158,11,.14); color:#fbbf24; }
    .z-haengt    { background:rgba(239,68,68,.15);  color:#f87171; }
    .z-offen     { background:rgba(96,165,250,.14); color:#60a5fa; }
    .z-am_platz  { background:rgba(255,255,255,.05);color:var(--text3); }
    .z-beurlaubt { background:rgba(255,255,255,.04);color:var(--text3); }

    @keyframes atmen   { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-2.5px)} }
    @keyframes tippen  { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-1.5px) rotate(.6deg)} }
    @keyframes wippen  { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-3px)} }
    @keyframes schimmer{ 0%,100%{box-shadow:0 0 14px -3px var(--mfarbe)} 50%{box-shadow:0 0 24px 0 var(--mfarbe)} }
    @keyframes pochen  { 0%,100%{opacity:1} 50%{opacity:.25} }
    @media (prefers-reduced-motion: reduce) {
      .fig, .papier, .monitor, .punkt { animation:none !important; }
    }

    /* ── Seitenspalte ──────────────────────────────────────────── */
    .karte {
      background:var(--surface); border:1px solid var(--border); border-radius:14px;
      padding:14px 16px; margin-bottom:14px;
    }
    .karte-kopf {
      display:flex; align-items:center; gap:8px; font-family:'Space Mono',monospace;
      font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--text3);
      margin-bottom:11px;
    }
    .karte-kopf .zahl { margin-left:auto; font-size:11px; font-weight:800; color:var(--text); }

    .postfach-item {
      display:flex; gap:9px; align-items:flex-start; padding:9px 0;
      border-top:1px solid var(--border); cursor:pointer;
    }
    .postfach-item:first-of-type { border-top:none; }
    .postfach-item:hover .pf-titel { color:var(--accent2); }
    .pf-titel { font-size:12px; font-weight:700; line-height:1.35; }
    .pf-meta { font-size:10px; color:var(--text3); font-family:'Space Mono',monospace; margin-top:2px; }
    .pf-alt { color:#fbbf24; }

    .ticker-item { display:flex; gap:8px; padding:7px 0; border-top:1px solid var(--border); font-size:11px; align-items:baseline; }
    .ticker-item:first-of-type { border-top:none; }
    .ticker-zeit { font-family:'Space Mono',monospace; font-size:9px; color:var(--text3); flex-shrink:0; width:64px; }
    .ticker-text { color:var(--text2); line-height:1.4; }
    .ticker-text b { color:var(--text); font-weight:700; }

    .besprechung { border-color:rgba(168,85,247,.4); background:linear-gradient(180deg, rgba(168,85,247,.08), var(--surface)); }

    /* ── Listen (Aufgaben, Befunde, Läufe, Berichte) ───────────── */
    .zeile {
      background:var(--surface); border:1px solid var(--border); border-radius:12px;
      padding:13px 15px; margin-bottom:9px; cursor:pointer; transition:border-color .15s;
    }
    .zeile:hover { border-color:rgba(255,255,255,.22); }
    .zeile-kopf { display:flex; align-items:flex-start; gap:10px; }
    .zeile-titel { flex:1; font-size:13.5px; font-weight:700; line-height:1.35; }
    .zeile-sub { font-size:11.5px; color:var(--text2); line-height:1.5; margin-top:5px; }
    .zeile-meta { display:flex; align-items:center; gap:7px; flex-wrap:wrap; margin-top:9px; }

    .marke { font-size:9.5px; font-weight:800; padding:2px 8px; border-radius:5px; letter-spacing:.04em; font-family:'Space Mono',monospace; text-transform:uppercase; }
    .m-grau   { background:rgba(255,255,255,.07); color:var(--text2); }
    .m-blau   { background:rgba(96,165,250,.14); color:#60a5fa; }
    .m-gruen  { background:rgba(34,197,94,.14);  color:#4ade80; }
    .m-gelb   { background:rgba(245,158,11,.15); color:#fbbf24; }
    .m-rot    { background:rgba(239,68,68,.15);  color:#f87171; }
    .m-lila   { background:rgba(168,85,247,.15); color:#c084fc; }
    .m-cyan   { background:rgba(6,182,212,.15);  color:#22d3ee; }

    .autor { display:inline-flex; align-items:center; gap:6px; font-size:11px; font-weight:700; }
    .autor .kugel { width:16px; height:16px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; font-size:8px; font-weight:800; color:#08111f; }

    /* ── Kennzahlen ────────────────────────────────────────────── */
    .zahlen-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:12px; margin-bottom:18px; }
    .zahl-karte { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:13px 15px; }
    .zahl-name { font-family:'Space Mono',monospace; font-size:9.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--text3); }
    .zahl-wert { font-size:23px; font-weight:800; letter-spacing:-.02em; margin-top:3px; }
    .zahl-karte svg { display:block; width:100%; height:34px; margin-top:6px; overflow:visible; }

    /* ── Überlagerung ──────────────────────────────────────────── */
    .ag-overlay {
      display:none; position:fixed; inset:0; z-index:9000;
      background:rgba(0,0,0,.78); backdrop-filter:blur(5px);
      align-items:center; justify-content:center; padding:20px;
    }
    .ag-overlay.offen { display:flex; }
    .ag-detail {
      background:var(--surface); border:1px solid var(--border2); border-radius:16px;
      width:min(760px,96vw); max-height:88vh; display:flex; flex-direction:column; overflow:hidden;
    }
    .ag-detail-kopf { padding:18px 22px; border-bottom:1px solid var(--border); display:flex; gap:14px; align-items:flex-start; }
    .ag-detail-kopf h2 { font-size:17px; font-weight:800; line-height:1.3; }
    .ag-detail-body { padding:20px 22px; overflow-y:auto; flex:1; }
    .ag-detail-fuss { padding:14px 22px; border-top:1px solid var(--border); display:flex; gap:9px; flex-wrap:wrap; background:var(--bg2); }
    .close-x { background:none; border:none; color:var(--text3); font-size:19px; cursor:pointer; line-height:1; padding:2px 6px; }
    .close-x:hover { color:var(--text); }

    .md { font-size:13px; line-height:1.65; color:var(--text2); }
    .md h1,.md h2,.md h3 { color:var(--text); margin:16px 0 7px; font-size:14px; font-weight:800; }
    .md h1 { font-size:16px; }
    .md p { margin:8px 0; }
    .md ul { margin:8px 0 8px 18px; }
    .md li { margin:3px 0; }
    .md code { background:var(--bg3); padding:1px 5px; border-radius:4px; font-family:'Space Mono',monospace; font-size:11.5px; color:#fbbf24; }
    .md pre { background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:11px 13px; overflow-x:auto; margin:10px 0; }
    .md pre code { background:none; padding:0; color:var(--text2); }
    .md strong { color:var(--text); }

    .verlauf-eintrag { border-left:2px solid var(--border2); padding:0 0 16px 15px; position:relative; }
    .verlauf-eintrag::before {
      content:''; position:absolute; left:-5px; top:4px; width:8px; height:8px;
      border-radius:50%; background:var(--border2);
    }
    .verlauf-eintrag:last-child { padding-bottom:0; }

    .feld { display:flex; flex-direction:column; gap:5px; margin-bottom:11px; }
    .feld label { font-family:'Space Mono',monospace; font-size:9.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--text3); }
    .feld input, .feld select, .feld textarea {
      background:var(--bg3); border:1px solid var(--border2); color:var(--text);
      border-radius:8px; padding:8px 11px; font-family:inherit; font-size:12.5px;
    }
    .feld textarea { min-height:70px; resize:vertical; line-height:1.5; }
    .feld input:focus, .feld select:focus, .feld textarea:focus { outline:none; border-color:var(--accent); }

    .hinweis {
      display:flex; gap:9px; align-items:flex-start; padding:11px 14px; border-radius:10px;
      background:rgba(96,165,250,.07); border:1px solid rgba(96,165,250,.25);
      font-size:12px; color:var(--text2); line-height:1.55; margin-bottom:16px;
    }
    .leer { text-align:center; padding:40px 20px; color:var(--text3); font-size:12.5px; }

    @media (max-width: 900px) {
      .buero-wrap { grid-template-columns:minmax(0,1fr); }
      .ag-pane { padding:16px; }
      .ag-tabs { padding:12px 16px 0; }
      .desks { grid-template-columns:repeat(auto-fill, minmax(140px,1fr)); gap:22px 14px; }
    }
  </style>
</head>
<body>

<div id="layout">
  <div id="main">

    <div class="page-header">
      <div class="ag-headbar">
        <div>
          <div class="page-title" style="display:flex;align-items:center;gap:10px">
            <i data-lucide="building-2" style="width:20px;height:20px;color:#a855f7"></i>
            Agentur
          </div>
          <div class="page-sub" id="ag-sub">Lade…</div>
        </div>
        <select class="ag-sel" id="ag-abteilung" onchange="wechsleAbteilung()"></select>
        <div class="ag-chips" id="ag-chips"></div>
      </div>
    </div>

    <div class="ag-tabs">
      <button class="ag-tab active" onclick="zeigeTab('buero',this)">
        <i data-lucide="building-2" style="width:13px;height:13px"></i> Büro
      </button>
      <button class="ag-tab" onclick="zeigeTab('aufgaben',this)">
        <i data-lucide="check-square-2" style="width:13px;height:13px"></i> Aufgaben <span class="ag-count" id="c-aufgaben">0</span>
      </button>
      <button class="ag-tab" onclick="zeigeTab('berichte',this)">
        <i data-lucide="file-text" style="width:13px;height:13px"></i> Berichte <span class="ag-count" id="c-berichte">0</span>
      </button>
      <button class="ag-tab" onclick="zeigeTab('befunde',this)">
        <i data-lucide="search-check" style="width:13px;height:13px"></i> Befunde <span class="ag-count" id="c-befunde">0</span>
      </button>
      <button class="ag-tab" onclick="zeigeTab('boerse',this)">
        <i data-lucide="candlestick-chart" style="width:13px;height:13px"></i> Börse
      </button>
      <button class="ag-tab" onclick="zeigeTab('kampagnen',this)">
        <i data-lucide="megaphone" style="width:13px;height:13px"></i> Kampagnen <span class="ag-count" id="c-kampagnen">0</span>
      </button>
      <button class="ag-tab" onclick="zeigeTab('laeufe',this)">
        <i data-lucide="activity" style="width:13px;height:13px"></i> Läufe <span class="ag-count" id="c-laeufe">0</span>
      </button>
      <button class="ag-tab" onclick="zeigeTab('team',this)">
        <i data-lucide="users" style="width:13px;height:13px"></i> Personal
      </button>
    </div>

    <div class="ag-pane active" id="pane-buero"></div>
    <div class="ag-pane" id="pane-aufgaben"></div>
    <div class="ag-pane" id="pane-berichte"></div>
    <div class="ag-pane" id="pane-befunde"></div>
    <div class="ag-pane" id="pane-boerse"></div>
    <div class="ag-pane" id="pane-kampagnen"></div>
    <div class="ag-pane" id="pane-laeufe"></div>
    <div class="ag-pane" id="pane-team"></div>

  </div>
</div>

<div class="ag-overlay" id="ag-overlay" onclick="if(event.target===this)schliesse()">
  <div class="ag-detail">
    <div class="ag-detail-kopf">
      <div style="flex:1" id="det-kopf"></div>
      <button class="close-x" onclick="schliesse()">✕</button>
    </div>
    <div class="ag-detail-body" id="det-body"></div>
    <div class="ag-detail-fuss" id="det-fuss"></div>
  </div>
</div>

<script src="js/utils.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/layout.js"></script>
<script>
// =============================================
// Agentur – Büro-Ansicht
// Alles, was hier animiert wird, kommt aus dem Board. Kein Effekt
// ohne Datengrundlage: ein leuchtender Monitor heißt, dass gerade
// wirklich ein Lauf offen ist.
// =============================================

let BOARD    = null;
let ABTEILUNG = localStorage.getItem('ag_abteilung') || '';
let BERICHTE = [];
let KENNZAHLEN = [];
let KAMPAGNEN = [];
let WISSEN = [];
let FRAGEN = [];
let TAKT = null;
let AKTIVER_TAB = 'buero';

const ZUSTAND_TEXT = {
  arbeitet:  'arbeitet',
  wartet:    'wartet auf dich',
  haengt:    'hängt',
  offen:     'in Arbeit',
  am_platz:  'am Platz',
  beurlaubt: 'beurlaubt',
};

const STATUS_MARKE = {
  offen:          ['m-grau',  'offen'],
  in_arbeit:      ['m-blau',  'in Arbeit'],
  zur_pruefung:   ['m-lila',  'zur Prüfung'],
  zur_freigabe:   ['m-gelb',  'zur Freigabe'],
  erledigt:       ['m-gruen', 'erledigt'],
  fehlgeschlagen: ['m-rot',   'fehlgeschlagen'],
  verworfen:      ['m-grau',  'verworfen'],
};

const ART_MARKE = {
  bericht:  ['m-blau',  'Bericht'],
  beitrag:  ['m-lila',  'Beitrag'],
  pruefung: ['m-gelb',  'Prüfung'],
  uebergabe:['m-grau',  'Übergabe'],
  befund:   ['m-cyan',  'Befund'],
  fehler:   ['m-rot',   'Fehler'],
  notiz:    ['m-grau',  'Notiz'],
};

const BEFUND_MARKE = {
  veraltet: ['m-gelb', 'veraltet'],
  kaputt:   ['m-rot',  'kaputt'],
  fehlt:    ['m-blau', 'fehlt'],
  seo:      ['m-gruen','SEO'],
  inhalt:   ['m-cyan', 'Inhalt'],
};

// ── Avatare: fünf Varianten, eingefärbt nach Mitarbeiter ─────────
function avatarSvg(m) {
  const f = m.farbe || '#3b82f6';
  const haar = {

function initialen(name) { return (name || '?').trim().slice(0, 1).toUpperCase(); }

function autorKugel(name, farbe) {
  return `<span class="autor"><span class="kugel" style="background:${esc(farbe || '#3b82f6')}">${esc(initialen(name))}</span>${esc(name || 'unbekannt')}</span>`;
}

function marke(paar) { return `<span class="marke ${paar[0]}">${esc(paar[1])}</span>`; }

function tageSeit(iso) {
  if (!iso) return 0;
  const t = Date.parse(iso.endsWith('Z') || iso.includes('+') ? iso : iso.replace(' ', 'T') + 'Z');
  if (!Number.isFinite(t)) return 0;
  return Math.floor((Date.now() - t) / 86400000);
}

function relativ(iso) {
  if (!iso) return '–';
  const t = Date.parse(iso.endsWith('Z') || iso.includes('+') ? iso : iso.replace(' ', 'T') + 'Z');
  if (!Number.isFinite(t)) return '–';
  const min = Math.floor((Date.now() - t) / 60000);
  if (min < 1) return 'gerade eben';
  if (min < 60) return `vor ${min} Min`;
  const std = Math.floor(min / 60);
  if (std < 24) return `vor ${std} Std`;
  const tg = Math.floor(std / 24);
  return tg === 1 ? 'gestern' : `vor ${tg} Tagen`;
}

function person(id) { return (BOARD?.team || []).find(m => m.id === id) || null; }
function funktion(id) { return (BOARD?.funktionen || []).find(f => f.id === id) || null; }
function personName(id) { return person(id)?.name || (id ? id : '–'); }

// ── Tabs ─────────────────────────────────────────────────────────
// Manche Tabs gehören nur zu einer Abteilung. Wer die Börse betritt, soll
// dort landen und nicht erst suchen.
const TAB_NUR_FUER = { kampagnen: ['marketing'], boerse: ['boerse'] };
const START_TAB = { boerse: 'boerse', marketing: 'buero' };

function tabsAnpassen() {
  let aktiverBleibt = true;
  document.querySelectorAll('.ag-tab').forEach(b => {
    const ziel = (b.getAttribute('onclick') || '').match(/zeigeTab\('([^']+)'/)?.[1];
    if (!ziel) return;
    const nur = TAB_NUR_FUER[ziel];
    const sichtbar = !nur || nur.includes(ABTEILUNG);
    b.style.display = sichtbar ? '' : 'none';
    if (!sichtbar && ziel === AKTIVER_TAB) aktiverBleibt = false;
  });
  if (!aktiverBleibt) {
    const ziel = START_TAB[ABTEILUNG] || 'buero';
    zeigeTab(ziel, [...document.querySelectorAll('.ag-tab')]
      .find(b => (b.getAttribute('onclick') || '').includes(`'${ziel}'`)));
  }
}

// Beim Wechsel in eine Abteilung deren Starttab öffnen – aber nur, wenn man
// nicht ohnehin schon auf einem Tab steht, den es dort gibt.
function starttabOeffnen() {
  const ziel = START_TAB[ABTEILUNG];
  if (!ziel || ziel === AKTIVER_TAB) return;
  const nur = TAB_NUR_FUER[AKTIVER_TAB];
  if (nur && !nur.includes(ABTEILUNG)) return;   // wird von tabsAnpassen erledigt
  if (AKTIVER_TAB !== 'buero') return;           // eine bewusste Auswahl nicht überschreiben
  zeigeTab(ziel, [...document.querySelectorAll('.ag-tab')]
    .find(b => (b.getAttribute('onclick') || '').includes(`'${ziel}'`)));
}

function zeigeTab(name, btn) {
  AKTIVER_TAB = name;
  document.querySelectorAll('.ag-tab').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  document.querySelectorAll('.ag-pane').forEach(p => p.classList.remove('active'));
  document.getElementById('pane-' + name).classList.add('active');
  if (name === 'berichte') ladeBerichte();
  if (name === 'kampagnen') ladeKampagnen();
  if (name === 'boerse') ladeBoerse();
  refreshIcons();
}

// ── Laden ────────────────────────────────────────────────────────
async function ladeBoard() {
  const q = ABTEILUNG ? `?abteilung=${encodeURIComponent(ABTEILUNG)}` : '';
  const [data, f, t] = await Promise.all([
    api('/api/agentur/board' + q),
    api('/api/agentur/fragen?status=offen'),
    api('/api/agentur/takt'),
  ]);
  FRAGEN = f?.fragen || [];
  TAKT = t;
  if (!data) {
    document.getElementById('pane-buero').innerHTML = errState();
    document.getElementById('ag-sub').textContent = 'API nicht erreichbar';
    refreshIcons();
    return;
  }
  BOARD = data;

  // Abteilungswähler befüllen
  const sel = document.getElementById('ag-abteilung');
  const abts = data.abteilungen || [];
  if (!ABTEILUNG && abts.length) { ABTEILUNG = abts[0].id; localStorage.setItem('ag_abteilung', ABTEILUNG); }
  sel.innerHTML = abts.map(a => `<option value="${esc(a.id)}"${a.id === ABTEILUNG ? ' selected' : ''}>${esc(a.name)}</option>`).join('')
    || '<option value="">Keine Abteilung</option>';

  const abt = abts.find(a => a.id === ABTEILUNG);
  document.getElementById('ag-sub').textContent = abt
    ? `${abt.beschreibung || abt.name} · ${(data.team || []).length} im Team`
    : 'Noch keine Abteilung angelegt';

  tabsAnpassen();
  starttabOeffnen();
  zeichneChips();
  zeichneBuero();
  zeichneAufgaben();
  zeichneBefunde();
  zeichneLaeufe();
  zeichneTeam();
  if (AKTIVER_TAB === 'berichte') ladeBerichte();
  refreshIcons();
}

async function ladeBerichte() {
  const [b, k] = await Promise.all([
    api(`/api/agentur/berichte?abteilung=${encodeURIComponent(ABTEILUNG)}&limit=40`),
    api(`/api/agentur/kennzahlen?abteilung=${encodeURIComponent(ABTEILUNG)}&tage=90`),
  ]);
  BERICHTE = b?.berichte || [];
  KENNZAHLEN = k?.kennzahlen || [];
  document.getElementById('c-berichte').textContent = BERICHTE.length;
  zeichneBerichte();
  refreshIcons();
}

function wechsleAbteilung() {
  ABTEILUNG = document.getElementById('ag-abteilung').value;
  localStorage.setItem('ag_abteilung', ABTEILUNG);
  ladeBoard();
}

// ── Kennzahl-Chips oben ──────────────────────────────────────────
function zeichneChips() {
  const z = BOARD.zaehler || {};
  const teile = [];
  if (z.laeuft) teile.push(`<div class="ag-chip live"><span class="punkt" style="width:6px;height:6px;border-radius:50%;background:currentColor"></span> LÄUFT <b>${z.laeuft}</b></div>`);
  teile.push(`<div class="ag-chip">AUFGABEN <b>${z.aufgaben_offen || 0}</b></div>`);
  if (z.zur_freigabe) teile.push(`<div class="ag-chip warn">ZUR FREIGABE <b>${z.zur_freigabe}</b></div>`);
  teile.push(`<div class="ag-chip">BEFUNDE <b>${z.befunde_offen || 0}</b></div>`);
  if (z.haengt) teile.push(`<div class="ag-chip bad">HÄNGT <b>${z.haengt}</b></div>`);
  document.getElementById('ag-chips').innerHTML = teile.join('');

  document.getElementById('c-aufgaben').textContent = z.aufgaben_offen || 0;
  document.getElementById('c-befunde').textContent  = z.befunde_offen || 0;
  document.getElementById('c-laeufe').textContent   = (BOARD.laeufe || []).length;
  const cf = document.getElementById('c-aufgaben');
  cf.classList.toggle('hot', !!z.zur_freigabe);
}

function zeichneBuero() {

    const tage = tageSeit(a.aktualisiert_am || a.erstellt_am);

      ${icon('file-check', 15, 'color:#fbbf24;flex-shrink:0;margin-top:2px')}

        <div class="pf-titel">${esc(a.titel)}</div>

      </div>
    </div>`;
  }).join('') : `<div style="font-size:11.5px;color:var(--text3)">Nichts wartet auf dich.</div>`;

  // Besprechungsraum
  const runden = BOARD.runden || [];
  const besprechung = runden.length ? `
    <div class="karte besprechung">
      <div class="karte-kopf">${icon('users', 12)} Besprechungsraum <span class="zahl">${runden.length}</span></div>

        let teiln = [];

        return `<div class="postfach-item" onclick="oeffneAufgabe(${r.id})">
          <div style="flex:1;min-width:0">
            <div class="pf-titel">${esc(r.titel)}</div>
            <div class="pf-meta">${teiln.length} Teilnehmer · als Nächstes: ${esc(personName(dran))}</div>
          </div>
        </div>`;
      }).join('')}
    </div>` : '';

  // Ticker
  const ticker = (BOARD.ticker || []).slice(0, 12);
  const tickerHtml = ticker.length ? ticker.map(t => {
    const art = ART_MARKE[t.art] || ART_MARKE.notiz;
    return `<div class="ticker-item">
      <span class="ticker-zeit">${esc(relativ(t.erstellt_am))}</span>
      <span class="ticker-text"><b>${esc(personName(t.mitarbeiter_id))}</b> · ${esc(art[1])}${t.titel ? ' · ' + esc(t.titel) : ''}</span>

    <div style="height:6px;border-radius:3px;background:var(--bg3);overflow:hidden;margin-bottom:6px">
      <div style="height:100%;width:${Math.min(100, t.auslastung_prozent)}%;background:${t.auslastung_prozent >= 100 ? '#ef4444' : t.auslastung_prozent >= 70 ? '#f59e0b' : '#22c55e'}"></div>
    </div>
    <div class="pf-meta" style="margin-bottom:10px">
      ${t.verbraucht_tokens.toLocaleString('de-DE')} von ${t.erlaubt_tokens.toLocaleString('de-DE')} Tokens

    ${t.hinweis ? `<div style="font-size:11px;color:#fbbf24;line-height:1.5;margin-bottom:10px">${icon('alert-triangle', 11)} ${esc(t.hinweis)}</div>` : ''}
    ${bloecke.map(([feld, label, zeit]) => `
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
        <span style="font-size:10.5px;width:78px;color:${t.block === feld.replace('block_', '') ? 'var(--text)' : 'var(--text3)'};font-family:'Space Mono',monospace">${esc(label)}</span>
        <span style="font-size:9.5px;color:var(--text3);width:40px;font-family:'Space Mono',monospace">${zeit}</span>
        <input type="range" min="0" max="100" step="5" value="${t.einstellungen[feld]}"
               oninput="document.getElementById('w-${feld}').textContent=this.value+' %'"
               onchange="stelleTakt('${feld}', this.value)" style="flex:1;accent-color:var(--accent)">
        <span id="w-${feld}" style="font-size:10.5px;width:38px;text-align:right;font-family:'Space Mono',monospace">${t.einstellungen[feld]} %</span>
      </div>`).join('')}
    <div style="display:flex;align-items:center;gap:8px;margin-top:10px;padding-top:9px;border-top:1px solid var(--border)">
      <span style="font-size:10.5px;color:var(--text3);font-family:'Space Mono',monospace">Bezugswert</span>
      <input type="number" step="1000000" min="0" value="${t.kontingent_tokens}"

    <div style="font-size:10px;color:var(--text3);line-height:1.5;margin-top:7px">

    </div>` : '<div style="font-size:11.5px;color:var(--text3)">Takt nicht geladen.</div>';

  // Fragen an dich – der Rückkanal. Was hier liegt, blockiert jemanden.
  const fragen = FRAGEN || [];
  const fragenHtml = fragen.length ? fragen.map(f => {
    const tage = tageSeit(f.erstellt_am);
    const d = f.dringlichkeit === 'blockiert' ? ['m-rot', 'blockiert']

    return `<div class="postfach-item" style="cursor:default;display:block">
      <div style="display:flex;gap:8px;align-items:center;margin-bottom:5px">

// ── Aufgaben ─────────────────────────────────────────────────────
function zeichneAufgaben() {
  const el = document.getElementById('pane-aufgaben');
  const aufgaben = BOARD.aufgaben || [];
  const kopf = `
    <div style="display:flex;justify-content:flex-end;margin-bottom:14px">
      <button class="btn btn-ghost" onclick="neueAufgabe()">${icon('plus', 13)} Aufgabe anlegen</button>
    </div>`;
  if (!aufgaben.length) {
    el.innerHTML = kopf + `<div class="leer">Keine offenen Aufgaben.</div>`;
    return;
  }
  const reihen = { zur_freigabe: [], zur_pruefung: [], in_arbeit: [], offen: [], rest: [] };
  aufgaben.forEach(a => (reihen[a.status] || reihen.rest).push(a));
  const alle = [...reihen.zur_freigabe, ...reihen.zur_pruefung, ...reihen.in_arbeit, ...reihen.offen, ...reihen.rest];
  el.innerHTML = kopf + alle.map(aufgabeZeile).join('');
}

function aufgabeZeile(a) {
  const st = STATUS_MARKE[a.status] || STATUS_MARKE.offen;
  const tage = tageSeit(a.aktualisiert_am || a.erstellt_am);
  const stockt = tage >= 3 && !['erledigt', 'verworfen'].includes(a.status);
  const p = person(a.zustaendig);
  return `<div class="zeile" onclick="oeffneAufgabe(${a.id})">
    <div class="zeile-kopf">
      <div class="zeile-titel">${esc(a.titel)}</div>
      ${marke(st)}
    </div>
    ${a.beschreibung ? `<div class="zeile-sub">${esc(String(a.beschreibung).slice(0, 180))}${a.beschreibung.length > 180 ? '…' : ''}</div>` : ''}
    <div class="zeile-meta">
      ${a.zustaendig ? autorKugel(p?.name || a.zustaendig, p?.farbe) : '<span class="marke m-grau">niemand zuständig</span>'}
      ${a.modus === 'runde' ? marke(['m-lila', 'Runde']) : ''}
      ${a.prioritaet === 'hoch' ? marke(['m-rot', 'hoch']) : ''}
      <span style="font-size:10.5px;color:${stockt ? '#fbbf24' : 'var(--text3)'};font-family:'Space Mono',monospace">
        ${stockt ? `unbewegt seit ${tage} Tagen` : relativ(a.aktualisiert_am || a.erstellt_am)}
      </span>
    </div>
  </div>`;
}

// ── Berichte + Kennzahlen ────────────────────────────────────────
function sparkline(werte, farbe) {
  if (werte.length < 2) return '';
  const min = Math.min(...werte), max = Math.max(...werte);
  const spanne = (max - min) || 1;
  const punkte = werte.map((w, i) => {
    const x = (i / (werte.length - 1)) * 100;
    const y = 30 - ((w - min) / spanne) * 26;
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(' ');
  return `<svg viewBox="0 0 100 32" preserveAspectRatio="none">
    <polyline points="${punkte}" fill="none" stroke="${farbe}" stroke-width="1.6"
              stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  </svg>`;
}

function zeichneBerichte() {
  const el = document.getElementById('pane-berichte');
  const gruppen = {};
  KENNZAHLEN.forEach(k => { (gruppen[k.name] ||= []).push(k); });

  const konf = [
    ['klicks', 'Klicks', '#4ade80', v => Math.round(v).toLocaleString('de-DE')],
    ['impressionen', 'Impressionen', '#60a5fa', v => Math.round(v).toLocaleString('de-DE')],
    ['ctr', 'CTR', '#fbbf24', v => (v * (v <= 1 ? 100 : 1)).toFixed(1) + ' %'],
    ['position', 'Ø Position', '#c084fc', v => v.toFixed(1)],
  ];
  const karten = konf.filter(([name]) => gruppen[name]?.length).map(([name, label, farbe, fmt]) => {
    const reihe = gruppen[name].sort((a, b) => a.datum.localeCompare(b.datum));
    const werte = reihe.map(r => r.wert);
    return `<div class="zahl-karte">
      <div class="zahl-name">${esc(label)}</div>
      <div class="zahl-wert" style="color:${farbe}">${esc(fmt(werte[werte.length - 1]))}</div>
      ${sparkline(werte, farbe)}
    </div>`;
  }).join('');

  const zahlenBlock = karten
    ? `<div class="zahlen-grid">${karten}</div>`
    : `<div class="hinweis">${icon('line-chart', 15)}<span>Noch keine Kennzahlen. Hol die Search-Console-Werte, dann stehen hier Klicks, Impressionen, CTR und Position als Verlauf.</span></div>`;

  const gscLeiste = `
    <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px">
      <button class="btn btn-ghost" id="gsc-btn" onclick="gscHolen()">${icon('download-cloud', 13)} Search-Console-Daten holen</button>
      <span id="gsc-status" style="font-size:11.5px;color:var(--text3);font-family:'Space Mono',monospace"></span>
    </div>`;

  const liste = BERICHTE.length ? BERICHTE.map(b => {
    const art = ART_MARKE[b.art] || ART_MARKE.notiz;
    const vorschau = String(b.text || '').replace(/[#*`>-]/g, '').trim().slice(0, 200);
    return `<div class="zeile" onclick="oeffneBericht(${b.id})">
      <div class="zeile-kopf">
        <div class="zeile-titel">${esc(b.titel || 'Ohne Titel')}</div>
        ${marke(art)}
      </div>
      ${vorschau ? `<div class="zeile-sub">${esc(vorschau)}…</div>` : ''}
      <div class="zeile-meta">
        ${autorKugel(b.autor, b.autor_farbe)}
        ${b.funktion_name ? `<span class="marke m-grau">${esc(b.funktion_name)}</span>` : ''}
        <span style="font-size:10.5px;color:var(--text3);font-family:'Space Mono',monospace">${esc(fmtDate(b.erstellt_am))}${b.lauf_id ? ` · Lauf #${b.lauf_id}` : ''}</span>
      </div>
    </div>`;
  }).join('') : `<div class="leer">Noch keine Berichte. Sie erscheinen hier, sobald der erste Lauf durch ist.</div>`;

  el.innerHTML = gscLeiste + zahlenBlock + liste;
}

// Holt die Tageswerte über den Worker – der Google-Schlüssel liegt dort als
// Secret und kommt nie in den Browser. Fehler werden im Klartext gezeigt:
// der häufigste ist eine Property, für die das Dienstkonto kein Leserecht hat.
async function gscHolen() {
  const btn = document.getElementById('gsc-btn');
  const status = document.getElementById('gsc-status');
  btn.disabled = true;
  status.style.color = 'var(--text3)';
  status.textContent = 'Frage Google…';
  try {
    const r = await fetch(API_URL + '/api/agentur/gsc/sync', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Auth-Token': getToken() || '' },
      body: JSON.stringify({ abteilung_id: ABTEILUNG, tage: 90 }),
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) {
      status.style.color = '#f87171';
      status.textContent = d.error || `Fehler ${r.status}`;
    } else if (!d.tage_geliefert) {
      status.style.color = '#fbbf24';
      status.textContent = d.hinweis || 'Keine Zeilen geliefert.';
    } else {
      // Erst neu zeichnen, dann melden – sonst überschreibt das Neuzeichnen
      // die Meldung sofort wieder.
      await ladeBerichte();
      const neu = document.getElementById('gsc-status');
      if (neu) {
        neu.style.color = '#4ade80';
        neu.textContent = `${d.tage_geliefert} Tage geholt (${d.zeitraum?.[0]} bis ${d.zeitraum?.[1]})`;
      }
    }
  } catch (e) {
    status.style.color = '#f87171';
    status.textContent = 'Verbindung fehlgeschlagen';
  }
  const b = document.getElementById('gsc-btn');
  if (b) b.disabled = false;
}

// Faktenlage, keine Beratung: Zahlen, Verlauf, Termine. Was daraus folgt,
// entscheidet Karol.
let BOERSE = null;
let BOERSE_ZEITRAUM = 0;   // 0 = alles, sonst Anzahl Handelstage von hinten

async function ladeBoerse(auffrischen) {
  const el = document.getElementById('pane-boerse');
  if (auffrischen) {
    el.querySelector('#bs-status')?.replaceChildren(document.createTextNode('Hole Kurse…'));
    await api('/api/agentur/boerse/auffrischen', { method: 'POST', body: {} });
  }
  // Voll laden, die Zeitraumknöpfe filtern clientseitig – sonst zeigte
  // „Alles" nur so weit, wie hier angefragt wurde.
  BOERSE = await api('/api/agentur/boerse/uebersicht?tage=400');
  zeichneBoerse();
  refreshIcons();
}

// Kursdiagramm: Fläche, Linie, Hoch- und Tiefmarke, Datumsachse und ein
// Fadenkreuz zum Ablesen. Bewusst ohne Bibliothek – die Seite lädt nichts nach.
const DIAGRAMM_DATEN = {};   // id -> Verlauf, für das Ablesen unter der Maus

function kursDiagramm(symbol, verlauf, farbe, waehrung, hoch) {
  const id = 'dg-' + symbol.replace(/[^a-z0-9]/gi, '');
  const h = hoch || 150;

  if (!verlauf || verlauf.length < 2) {
    return `<div style="height:${h}px;display:flex;align-items:center;justify-content:center;
      border:1px dashed var(--border2);border-radius:10px;color:var(--text3);font-size:11.5px;text-align:center;padding:0 20px">
      Noch kein Verlauf. „Historie laden" holt die vergangenen Monate,
      sonst wächst die Linie ab dem zweiten Tagesabruf.
    </div>`;
  }

  const gefiltert = verlauf.slice(-(BOERSE_ZEITRAUM === 0 ? verlauf.length : BOERSE_ZEITRAUM));
  DIAGRAMM_DATEN[id] = gefiltert;

  const werte = gefiltert.map(v => v.kurs);
  const min = Math.min(...werte), max = Math.max(...werte);
  const spanne = (max - min) || Math.abs(min) * 0.02 || 1;
  const B = 600, H = 140, R = { o: 12, u: 22, l: 0, r: 48 };
  const px = i => R.l + (i / (gefiltert.length - 1)) * (B - R.l - R.r);
  const py = w => R.o + (1 - (w - min) / spanne) * (H - R.o - R.u);

  const linie = gefiltert.map((v, i) => `${px(i).toFixed(1)},${py(v.kurs).toFixed(1)}`).join(' ');
  const flaeche = `${R.l},${H - R.u} ${linie} ${px(gefiltert.length - 1).toFixed(1)},${H - R.u}`;

  const iMax = werte.indexOf(max), iMin = werte.indexOf(min);
  const zahlFmt = n => Number(n).toLocaleString('de-DE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const erst = gefiltert[0], letzt = gefiltert[gefiltert.length - 1];
  const wandel = erst.kurs ? ((letzt.kurs - erst.kurs) / erst.kurs) * 100 : 0;

  return `
    <div style="position:relative" onmousemove="diagrammLesen(event,'${id}')" onmouseleave="diagrammVerlassen('${id}')">
      <svg viewBox="0 0 ${B} ${H}" preserveAspectRatio="none" id="${id}"
           style="display:block;width:100%;height:${h}px;overflow:visible;cursor:crosshair">
        <defs>
          <linearGradient id="${id}-f" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="${farbe}" stop-opacity=".28"/>
            <stop offset="100%" stop-color="${farbe}" stop-opacity="0"/>
          </linearGradient>
        </defs>
        <polygon points="${flaeche}" fill="url(#${id}-f)"/>
        <polyline points="${linie}" fill="none" stroke="${farbe}" stroke-width="1.8"
                  stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
        <circle cx="${px(iMax).toFixed(1)}" cy="${py(max).toFixed(1)}" r="2.5" fill="${farbe}"/>
        <circle cx="${px(iMin).toFixed(1)}" cy="${py(min).toFixed(1)}" r="2.5" fill="${farbe}" opacity=".6"/>
        <line id="${id}-kreuz" x1="0" y1="${R.o}" x2="0" y2="${H - R.u}"
              stroke="var(--text3)" stroke-width="1" vector-effect="non-scaling-stroke" style="display:none"/>
      </svg>
      <div style="position:absolute;right:0;top:6px;font-size:10px;color:var(--text3);font-family:'Space Mono',monospace;text-align:right;pointer-events:none">
        ${zahlFmt(max)}<br><span style="opacity:.55">${zahlFmt(min)}</span>
      </div>
      <div style="display:flex;justify-content:space-between;font-size:9.5px;color:var(--text3);font-family:'Space Mono',monospace;margin-top:-14px;padding-right:48px;pointer-events:none">
        <span>${esc(erst.datum)}</span><span>${esc(letzt.datum)}</span>
      </div>
      <div id="${id}-tip" style="position:absolute;top:0;left:0;display:none;pointer-events:none;
           background:var(--bg);border:1px solid var(--border2);border-radius:7px;padding:4px 8px;
           font-size:11px;font-family:'Space Mono',monospace;white-space:nowrap;z-index:5"></div>
      <div style="font-size:10.5px;color:var(--text3);font-family:'Space Mono',monospace;margin-top:4px">
        ${gefiltert.length} Handelstage · ${wandel >= 0 ? '+' : ''}${wandel.toFixed(1)} % im Zeitraum
      </div>
    </div>`;
}

function diagrammLesen(ev, id) {
  const daten = DIAGRAMM_DATEN[id];
  const svg = document.getElementById(id);
  if (!daten || !svg) return;
  const kasten = svg.getBoundingClientRect();
  const anteil = Math.max(0, Math.min(1, (ev.clientX - kasten.left) / kasten.width));
  // Rechter Rand des Diagramms ist Beschriftung, nicht Datenfläche.
  const i = Math.round(anteil * (600 / (600 - 48)) * (daten.length - 1));
  const p = daten[Math.max(0, Math.min(daten.length - 1, i))];
  if (!p) return;

  const kreuz = document.getElementById(id + '-kreuz');
  if (kreuz) {
    const x = (Math.max(0, Math.min(daten.length - 1, i)) / (daten.length - 1)) * (600 - 48);
    kreuz.setAttribute('x1', x); kreuz.setAttribute('x2', x);
    kreuz.style.display = '';
  }
  const tip = document.getElementById(id + '-tip');
  if (tip) {
    tip.textContent = `${p.datum} · ${Number(p.kurs).toLocaleString('de-DE', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
    tip.style.display = 'block';
    tip.style.left = Math.min(kasten.width - 130, Math.max(0, ev.clientX - kasten.left - 60)) + 'px';
  }
}

function diagrammVerlassen(id) {
  const k = document.getElementById(id + '-kreuz'); if (k) k.style.display = 'none';
  const t = document.getElementById(id + '-tip'); if (t) t.style.display = 'none';
}

function zeichneBoerse() {
  const el = document.getElementById('pane-boerse');
  if (!BOERSE) { el.innerHTML = errState(); return; }
  const b = BOERSE;
  const geld = (n, w) => n === null || n === undefined ? '–' : `${Number(n).toLocaleString('de-DE', { minimumFractionDigits: 2, maximumFractionDigits: 2 })} ${w || ''}`.trim();
  const vz = n => n > 0 ? '+' : '';
  const farbeVon = n => n === null || n === undefined ? 'var(--text2)' : n > 0 ? '#4ade80' : n < 0 ? '#f87171' : 'var(--text2)';

  const s = b.summe || {};
  const summeBlock = `
    <div class="zahlen-grid">
      <div class="zahl-karte">
        <div class="zahl-name">Depotwert</div>
        <div class="zahl-wert">${s.wert === null || s.wert === undefined ? '–' : geld(s.wert)}</div>
        <div style="font-size:10.5px;color:var(--text3);font-family:'Space Mono',monospace;margin-top:4px">
          ${s.bewertet || 0} von ${s.von || 0} Positionen bewertet
        </div>
      </div>
      <div class="zahl-karte">
        <div class="zahl-name">Einsatz</div>
        <div class="zahl-wert" style="color:var(--text2)">${s.einsatz === null || s.einsatz === undefined ? '–' : geld(s.einsatz)}</div>
      </div>
      <div class="zahl-karte">
        <div class="zahl-name">Ergebnis</div>
        <div class="zahl-wert" style="color:${farbeVon(s.ergebnis)}">
          ${s.ergebnis === null || s.ergebnis === undefined ? '–' : vz(s.ergebnis) + geld(s.ergebnis)}
        </div>
        ${s.ergebnis_prozent !== null && s.ergebnis_prozent !== undefined
          ? `<div style="font-size:10.5px;color:${farbeVon(s.ergebnis_prozent)};font-family:'Space Mono',monospace;margin-top:4px">${vz(s.ergebnis_prozent)}${s.ergebnis_prozent} %</div>` : ''}
      </div>
    </div>`;

  const karte = (p, gehalten) => {
    const st = p.stammdaten || {};
    const farbe = p.veraenderung_prozent > 0 ? '#4ade80' : p.veraenderung_prozent < 0 ? '#f87171' : '#60a5fa';
    return `<div class="zeile" style="cursor:default">
      <div class="zeile-kopf">
        <div class="zeile-titel">${esc(p.symbol)}<span style="color:var(--text3);font-weight:400"> · ${esc(p.name || st.name || '')}</span></div>
        ${p.kurs !== null ? `<span class="marke" style="background:rgba(255,255,255,.06);color:${farbe}">
          ${geld(p.kurs, st.waehrung || p.waehrung)} ${p.veraenderung_prozent !== null ? `(${vz(p.veraenderung_prozent)}${p.veraenderung_prozent} %)` : ''}
        </span>` : marke(['m-grau', 'kein Kurs'])}
      </div>
      ${kursDiagramm(p.symbol, p.verlauf, farbe, st.waehrung || p.waehrung, gehalten ? 150 : 110)}
      <div class="zeile-meta">
        ${gehalten ? `<span style="font-size:11.5px;color:var(--text2)">${p.stueck} Stück zu ${geld(p.kaufkurs, p.waehrung)}</span>` : ''}
        ${gehalten && p.ergebnis !== null ? `<span class="marke" style="background:rgba(255,255,255,.06);color:${farbeVon(p.ergebnis)}">${vz(p.ergebnis)}${geld(p.ergebnis, p.waehrung)} · ${vz(p.ergebnis_prozent)}${p.ergebnis_prozent} %</span>` : ''}
        ${gehalten && p.waehrung_konflikt ? `<span class="marke m-rot" title="Kurs und Kaufpreis stehen in verschiedenen Währungen — ein Vergleich wäre eine Fantasiezahl">Währung: Kurs ${esc(p.kurs_waehrung)}, Kauf ${esc(p.waehrung)}</span>` : ''}
        ${st.naechste_zahlen ? marke(['m-gelb', 'Zahlen ' + st.naechste_zahlen]) : ''}
        ${st.hoch_52w ? `<span style="font-size:10.5px;color:var(--text3);font-family:'Space Mono',monospace">52W ${st.tief_52w?.toFixed?.(0) ?? '–'}–${st.hoch_52w?.toFixed?.(0) ?? '–'}</span>` : ''}
        ${st.kgv ? `<span style="font-size:10.5px;color:var(--text3);font-family:'Space Mono',monospace">KGV ${Number(st.kgv).toFixed(1)}</span>` : ''}
        ${!gehalten && p.grund ? `<span style="font-size:10.5px;color:var(--text3)">${esc(p.grund)}</span>` : ''}
        ${gehalten ? `<button class="btn btn-ghost btn-sm" style="margin-left:auto" onclick="verkauft(${p.id})">${icon('archive', 11)} verkauft</button>` : ''}
      </div>
    </div>`;
  };

  el.innerHTML = `
    <div class="hinweis">${icon('info', 15)}<span>
      Dieser Bereich trägt <b>Fakten</b> zusammen: Kurse, Kennzahlen, Termine, Meldungen.
      Er gibt keine Kauf-, Verkaufs- oder Halteempfehlungen — das wäre Anlageberatung.
      Entschieden wird von dir.
    </span></div>

    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px">
      <button class="btn btn-ghost" onclick="ladeBoerse(true)">${icon('refresh-cw', 13)} Kurse holen</button>
      <button class="btn btn-ghost" onclick="ladeHistorie()">${icon('history', 13)} Historie laden</button>
      <button class="btn btn-ghost" onclick="neuePosition()">${icon('plus', 13)} Position</button>
      <button class="btn btn-ghost" onclick="neueBeobachtung()">${icon('eye', 13)} Beobachten</button>
      <a class="btn btn-primary" href="terminal.html" style="text-decoration:none">${icon('candlestick-chart', 13)} Terminal öffnen</a>
      <div style="display:flex;gap:3px;margin-left:auto">
        ${[[22, '1M'], [66, '3M'], [132, '6M'], [0, 'Alles']].map(([n, l]) => `
          <button class="btn ${BOERSE_ZEITRAUM === n ? 'btn-primary' : 'btn-ghost'} btn-sm"
                  onclick="BOERSE_ZEITRAUM=${n};zeichneBoerse();refreshIcons()">${l}</button>`).join('')}
      </div>
    </div>
    <div id="bs-status" style="font-size:11.5px;color:${b.fehler ? '#f87171' : 'var(--text3)'};font-family:'Space Mono',monospace;margin-bottom:14px">
      ${b.fehler ? esc(b.fehler.join(' · ')) : b.hinweis ? esc(b.hinweis) : 'Stand ' + fmtDate(b.stand)}
    </div>

    ${summeBlock}
    ${b.ohne_kurs ? `<div class="hinweis" style="background:rgba(245,158,11,.07);border-color:rgba(245,158,11,.25)">${icon('alert-triangle', 15)}<span>Ohne Kurs und deshalb nicht bewertet: ${esc(b.ohne_kurs.join(', '))}</span></div>` : ''}
    ${b.waehrung_konflikte ? `<div class="hinweis" style="background:rgba(239,68,68,.07);border-color:rgba(239,68,68,.3)">${icon('alert-octagon', 15)}<span>
      <b>Nicht vergleichbar:</b> ${esc(b.waehrung_konflikte.join(' · '))}.
      Kurs und Kaufpreis stehen in verschiedenen Währungen — ein Ergebnis daraus wäre eine Fantasiezahl.
      Trag den Kaufpreis in der Währung des Kurses ein, dann rechnet es wieder.
    </span></div>` : ''}

    <div class="karte-kopf" style="margin-top:6px">${icon('briefcase', 12)} Depot <span class="zahl">${(b.positionen || []).length}</span></div>
    ${(b.positionen || []).length ? b.positionen.map(p => karte(p, true)).join('') : '<div class="leer">Noch keine Positionen hinterlegt.</div>'}

    <div class="karte-kopf" style="margin-top:20px">${icon('eye', 12)} Beobachtet <span class="zahl">${(b.beobachtet || []).length}</span></div>
    ${(b.beobachtet || []).length ? b.beobachtet.map(p => karte(p, false)).join('') : '<div class="leer">Nichts auf der Beobachtungsliste.</div>'}`;
}

// Suche: tippt man „Nvidia" oder „NVDA", kommen Vorschläge mit Kürzel und
// vollem Namen. Der Name wird beim Anklicken mit übernommen.
let SUCHE_WARTE = null;

function sucheFeld(idSymbol, idName) {
  return `
    <div style="position:relative">
      <input id="${idSymbol}" placeholder="Nvidia oder NVDA" autocomplete="off"
             oninput="symbolSuchen('${idSymbol}','${idName}')"
             onblur="setTimeout(()=>{const l=document.getElementById('${idSymbol}-liste'); if(l) l.style.display='none'},180)">
      <div id="${idSymbol}-liste" style="display:none;position:absolute;top:100%;left:0;right:0;z-index:20;
           background:var(--surface2);border:1px solid var(--border2);border-radius:9px;margin-top:4px;
           max-height:230px;overflow-y:auto;box-shadow:0 12px 28px -12px rgba(0,0,0,.9)"></div>
    </div>`;
}

async function symbolSuchen(idSymbol, idName) {
  const q = document.getElementById(idSymbol).value.trim();
  const liste = document.getElementById(idSymbol + '-liste');
  clearTimeout(SUCHE_WARTE);
  if (q.length < 2) { liste.style.display = 'none'; return; }

  SUCHE_WARTE = setTimeout(async () => {
    const d = await api('/api/agentur/boerse/suche?q=' + encodeURIComponent(q));
    const treffer = d?.treffer || [];
    if (!treffer.length) {
      liste.innerHTML = `<div style="padding:9px 11px;font-size:11.5px;color:var(--text3)">
        ${d && d.error ? esc(d.error) : 'Nichts gefunden. Kürzel lässt sich auch direkt eintragen.'}</div>`;
      liste.style.display = 'block';
      return;
    }
    liste.innerHTML = treffer.map(t => `
      <div onmousedown="symbolWaehlen('${idSymbol}','${idName}','${esc(t.symbol)}','${esc((t.name || '').replace(/'/g, ''))}')"
           style="padding:8px 11px;cursor:pointer;border-bottom:1px solid var(--border)"
           onmouseover="this.style.background='rgba(255,255,255,.05)'"
           onmouseout="this.style.background='none'">
        <div style="font-size:12.5px;font-weight:700">${esc(t.symbol)}</div>
        <div style="font-size:11px;color:var(--text2)">${esc(t.name || '')}${t.art ? ` · ${esc(t.art)}` : ''}</div>
      </div>`).join('');
    liste.style.display = 'block';
  }, 260);
}

function symbolWaehlen(idSymbol, idName, symbol, name) {
  document.getElementById(idSymbol).value = symbol;
  const n = document.getElementById(idName);
  if (n && name) n.value = name;
  document.getElementById(idSymbol + '-liste').style.display = 'none';
}

function neuePosition() {

// Historie nachladen: einmal je Wert, danach steht die Linie.
async function ladeHistorie() {
  const s = document.getElementById('bs-status');
  if (s) { s.textContent = 'Hole Historie…'; s.style.color = 'var(--text3)'; }
  const d = await api('/api/agentur/boerse/historie', { method: 'POST', body: { tage: 250 } });
  await ladeBoerse();
  const s2 = document.getElementById('bs-status');
  if (s2) {
    if (d?.geladen?.length) {
      s2.style.color = '#4ade80';
      s2.textContent = d.geladen.map(g => `${g.symbol}: ${g.punkte} Tage (${g.quelle})`).join(' · ');
    } else {
      // Der genaue Grund je Quelle ist brauchbarer als die allgemeine
      // Erklärung – deshalb steht er zuerst.
      s2.style.color = '#fbbf24';
      s2.innerHTML = [
        d?.hinweise?.length ? esc(d.hinweise.join(' | ')) : null,
        d?.erklaerung ? `<span style="opacity:.7">${esc(d.erklaerung)}</span>` : null,
      ].filter(Boolean).join('<br>') || 'Keine Historie erhalten.';
    }
  }
}

const KAMPAGNE_MARKE = {
  geplant:     ['m-grau',  'geplant'],
  laeuft:      ['m-blau',  'läuft'],
  beendet:     ['m-gelb',  'beendet, nicht ausgewertet'],
  ausgewertet: ['m-gruen', 'ausgewertet'],
  verworfen:   ['m-grau',  'verworfen'],
};

async function ladeKampagnen() {
  const [k, w] = await Promise.all([
    api(`/api/agentur/kampagnen?abteilung=${encodeURIComponent(ABTEILUNG)}`),
    api(`/api/agentur/wissen?abteilung=${encodeURIComponent(ABTEILUNG)}&limit=50`),
  ]);
  KAMPAGNEN = k?.kampagnen || [];
  WISSEN = w?.wissen || [];
  document.getElementById('c-kampagnen').textContent = KAMPAGNEN.length;

  refreshIcons();
}

function zeichneKampagnen() {
  const el = document.getElementById('pane-kampagnen');

  const liste = KAMPAGNEN.length ? KAMPAGNEN.map(k => {
    const st = KAMPAGNE_MARKE[k.status] || KAMPAGNE_MARKE.geplant;
    const zeitraum = [k.start_am, k.ende_am].filter(Boolean).join(' bis ') || 'ohne Zeitraum';
    return `<div class="zeile" onclick="oeffneKampagne(${k.id})">
      <div class="zeile-kopf">
        <div class="zeile-titel">${esc(k.titel)}</div>
        ${marke(st)}
      </div>
      ${k.ziel ? `<div class="zeile-sub"><b style="color:var(--text2)">Ziel:</b> ${esc(k.ziel)}</div>` : ''}
      <div class="zeile-meta">

        ${k.produkt ? marke(['m-grau', k.produkt]) : ''}

        <span style="font-size:10.5px;color:var(--text3);font-family:'Space Mono',monospace">${esc(zeitraum)}</span>
      </div>
    </div>`;
  }).join('') : `<div class="leer">Noch keine Kampagnen. Nina legt sie an, sobald sie eine fällige Planungsaufgabe hat.</div>`;

  const wissen = WISSEN.length ? WISSEN.map(w => {
    const v = w.verlaesslich === 'gemessen' ? ['m-gruen', 'gemessen']

            : ['m-blau', 'Beobachtung'];

      <div style="flex:1;min-width:0">

    </div>`;
  }).join('') : `<div style="font-size:11.5px;color:var(--text3)">Noch nichts gelernt. Der Pool füllt sich, wenn Nina Kampagnen auswertet.</div>`;

  el.innerHTML = `
    <div class="buero-wrap">

        <div style="display:flex;justify-content:flex-end;margin-bottom:14px">

          ${wissen}

}

async function oeffneKampagne(id) {
  zeigeDetail('<h2>Lade…</h2>', loadingState(), '');
  const [d, gemessen] = await Promise.all([
    api('/api/agentur/kampagnen/' + id),
    api('/api/agentur/kampagnen/' + id + '/zahlen'),
  ]);
  if (!d) { zeigeDetail('<h2>Fehler</h2>', errState(), ''); return; }
  const k = d.kampagne;
  const st = KAMPAGNE_MARKE[k.status] || KAMPAGNE_MARKE.geplant;

  const kopf = `<div style="margin-bottom:8px">${marke(st)}${k.kanal ? marke(['m-lila', k.kanal]) : ''}</div>
    <h2>${esc(k.titel)}</h2>
    <div class="page-sub">${[k.start_am, k.ende_am].filter(Boolean).join(' bis ') || 'ohne Zeitraum'} · verantwortlich: ${esc(personName(k.verantwortlich))}</div>`;

  const berichtet = (d.ergebnisse || []).filter(e => e.herkunft === 'berichtet');
  const gemessenListe = (gemessen?.zahlen || []);

  const zeile = e => `<div style="display:flex;gap:10px;padding:6px 0;border-top:1px solid var(--border);font-size:12.5px">
      <span style="flex:1">${esc(e.name)}${e.quelle ? ` <span style="color:var(--text3);font-size:11px">(${esc(e.quelle)})</span>` : ''}</span>
      <b>${Number(e.wert).toLocaleString('de-DE')}${e.einheit ? ' ' + esc(e.einheit) : ''}</b>
    </div>`;

  const body = `
    ${k.ziel ? `<div class="karte"><div class="karte-kopf">${icon('target', 12)} Ziel</div>
      <div style="font-size:12.5px;line-height:1.6;color:var(--text2)">${esc(k.ziel)}</div></div>` : ''}
    ${k.hypothese ? `<div class="karte"><div class="karte-kopf">${icon('flask-conical', 12)} Hypothese</div>
      <div style="font-size:12.5px;line-height:1.6;color:var(--text2)">${esc(k.hypothese)}</div></div>` : ''}

    <div class="karte">
      <div class="karte-kopf">${icon('bar-chart-3', 12)} Gemessen — eigene Daten <span class="zahl">${gemessenListe.length}</span></div>
      ${gemessenListe.length ? gemessenListe.map(zeile).join('')
        : `<div style="font-size:11.5px;color:var(--text3)">${esc(gemessen?.hinweis || 'Keine Messwerte.')}</div>`}
    </div>

    <div class="karte">
      <div class="karte-kopf">${icon('hand', 12)} Berichtet — von dir nachgetragen <span class="zahl">${berichtet.length}</span></div>
      ${berichtet.length ? berichtet.map(zeile).join('')
        : `<div style="font-size:11.5px;color:var(--text3)">Noch nichts nachgetragen.</div>`}
      <div style="display:grid;grid-template-columns:1.4fr 1fr 1fr auto;gap:8px;margin-top:12px;align-items:end">
        <div class="feld" style="margin:0"><label>Was</label><input id="erg-name" placeholder="upvotes"></div>
        <div class="feld" style="margin:0"><label>Wert</label><input id="erg-wert" type="number" step="any" placeholder="142"></div>
        <div class="feld" style="margin:0"><label>Quelle</label><input id="erg-quelle" placeholder="reddit"></div>
        <button class="btn btn-ghost" onclick="ergebnisNachtragen(${k.id})">${icon('plus', 12)} Eintragen</button>
      </div>
      <div id="erg-fehler" style="color:#f87171;font-size:11.5px;margin-top:6px"></div>
    </div>

    ${k.fazit ? `<div class="karte"><div class="karte-kopf">${icon('flag', 12)} Fazit</div>
      <div class="md">${mdToHtml(k.fazit)}</div></div>` : ''}

    ${(d.aufgaben || []).length ? `<div class="karte"><div class="karte-kopf">${icon('list-checks', 12)} Aufgaben</div>
      ${d.aufgaben.map(a => `<div style="font-size:12.5px;padding:5px 0;border-top:1px solid var(--border);cursor:pointer" onclick="oeffneAufgabe(${a.id})">${esc(a.titel)} ${marke(STATUS_MARKE[a.status] || STATUS_MARKE.offen)}</div>`).join('')}</div>` : ''}`;

  let fuss = '';
  if (k.status === 'geplant') fuss = `<button class="btn btn-primary" onclick="setzeKampagne(${k.id},'laeuft')">${icon('play', 13)} Starten</button>`;
  if (k.status === 'laeuft')  fuss = `<button class="btn btn-primary" onclick="setzeKampagne(${k.id},'beendet')">${icon('square', 13)} Beenden</button>`;
  if (!['ausgewertet', 'verworfen'].includes(k.status)) {
    fuss += `<button class="btn btn-danger" onclick="setzeKampagne(${k.id},'verworfen')">${icon('x', 13)} Verwerfen</button>`;
  }
  zeigeDetail(kopf, body, fuss);
}

async function ergebnisNachtragen(id) {
  const name = document.getElementById('erg-name').value.trim();
  const wert = document.getElementById('erg-wert').value;
  const fehler = document.getElementById('erg-fehler');

  await api(`/api/agentur/kampagnen/${id}/ergebnisse`, {
    method: 'POST',
    body: { herkunft: 'berichtet', name, wert: Number(wert), quelle: document.getElementById('erg-quelle').value.trim() || null },

  oeffneKampagne(id);

// ── Läufe ────────────────────────────────────────────────────────
function zeichneLaeufe() {
  const el = document.getElementById('pane-laeufe');
  const laeufe = BOARD.laeufe || [];
  if (!laeufe.length) {
    el.innerHTML = `<div class="hinweis">${icon('activity', 15)}<span>Noch keine Läufe. Jeder Lauf meldet sich am Anfang und am Ende – auch ein abgestürzter bleibt sichtbar, statt still zu verschwinden.</span></div>`;
    return;
  }
  const statusMarke = {
    laeuft:         ['m-blau',  'läuft'],
    erfolgreich:    ['m-gruen', 'erfolgreich'],
    leerlauf:       ['m-grau',  'nichts zu tun'],
    fehlgeschlagen: ['m-rot',   'fehlgeschlagen'],
  };

  // Tokens statt Dollar: über das Abo-Token ist der Dollarwert nur ein
  // Gegenwert. Was zählt, ist der Verbrauch am Kontingent.
  const mitTokens = laeufe.filter(l => l.kosten_tokens > 0);
  const summeTok = mitTokens.reduce((s, l) => s + l.kosten_tokens, 0);
  const schnittTok = mitTokens.length ? Math.round(summeTok / mitTokens.length) : 0;
  const summeUsd = mitTokens.reduce((s, l) => s + (l.kosten_usd || 0), 0);
  const zahl = n => Number(n).toLocaleString('de-DE');
  const kostenBlock = mitTokens.length ? `
    <div class="zahlen-grid">
      <div class="zahl-karte">
        <div class="zahl-name">Tokens gesamt</div>
        <div class="zahl-wert" style="color:#fbbf24">${zahl(summeTok)}</div>
        <div style="font-size:10.5px;color:var(--text3);font-family:'Space Mono',monospace;margin-top:4px">${mitTokens.length} Läufe · Gegenwert $ ${summeUsd.toFixed(2)}</div>
      </div>
      <div class="zahl-karte">
        <div class="zahl-name">Ø je Lauf</div>
        <div class="zahl-wert" style="color:#60a5fa">${zahl(schnittTok)}</div>
        <div style="font-size:10.5px;color:var(--text3);font-family:'Space Mono',monospace;margin-top:4px">Tokens</div>
      </div>
      ${TAKT ? `<div class="zahl-karte">
        <div class="zahl-name">${esc(TAKT.fenster_stunden)}-Stunden-Fenster</div>
        <div class="zahl-wert" style="color:${TAKT.auslastung_prozent >= 100 ? '#f87171' : '#4ade80'}">${TAKT.auslastung_prozent} %</div>
        <div style="font-size:10.5px;color:var(--text3);font-family:'Space Mono',monospace;margin-top:4px">${zahl(TAKT.verbraucht_tokens)} von ${zahl(TAKT.erlaubt_tokens)}</div>
      </div>` : ''}
    </div>` : `<div class="hinweis">${icon('gauge', 15)}<span>Noch kein Lauf mit Tokenangabe. Sobald einer über den Runner lief, steht hier der Verbrauch – und wie er sich zu deinem freigegebenen Anteil verhält.</span></div>`;

  el.innerHTML = kostenBlock + laeufe.map(l => {
    const p = person(l.mitarbeiter_id);
    const st = statusMarke[l.status] || statusMarke.laeuft;
    const dauer = l.dauer_ms ? `${Math.round(l.dauer_ms / 1000)} s` : (l.status === 'laeuft' ? 'läuft noch' : '–');
    return `<div class="zeile" style="cursor:default">
      <div class="zeile-kopf">
        <div class="zeile-titel">${esc(l.mitarbeiter_name || p?.name || l.mitarbeiter_id)}<span style="color:var(--text3);font-weight:400"> · Lauf #${l.id}</span></div>
        ${marke(st)}
      </div>
      ${l.zusammenfassung ? `<div class="zeile-sub">${esc(l.zusammenfassung)}</div>` : ''}
      ${l.fehler ? `<div class="zeile-sub" style="color:#f87171">${esc(l.fehler)}</div>` : ''}
      <div class="zeile-meta">
        <span class="marke m-grau">${esc(l.ausloeser || 'manuell')}</span>
        <span style="font-size:10.5px;color:var(--text3);font-family:'Space Mono',monospace">
          ${esc(fmtDate(l.gestartet_am))} · ${esc(dauer)} · ${l.eintraege_anzahl || 0} Einträge
        </span>
        ${l.kosten_tokens > 0 ? `<span class="marke m-gelb">${Number(l.kosten_tokens).toLocaleString('de-DE')} Tokens</span>` : ''}
      </div>
    </div>`;
  }).join('');
}
